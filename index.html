<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1">
  <title>Kingdom Runner — Shaders Edition</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1e12">

  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1e12; touch-action: none }
    canvas { display: block; cursor: crosshair; touch-action: none }
    
    .hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; gap: 12px; pointer-events: none; z-index: 10; flex-wrap: wrap }
    .hud>* { pointer-events: auto }
    .resources { display: flex; gap: 10px; background: rgba(20, 40, 25, .92); padding: 10px 18px; border-radius: 40px; border: 2px solid #d4af37; flex-wrap: wrap; box-shadow: 0 4px 15px rgba(0,0,0,0.5); backdrop-filter: blur(5px); }
    .res-item { color: #f5e6b0; font-weight: bold; display: flex; align-items: center; gap: 6px; font-size: .85rem }
    .res-item span { background: #0e2b18; padding: 3px 12px; border-radius: 20px; min-width: 60px; text-align: center; border: 1px solid #8b6914; color: #fff8e7; box-shadow: inset 0 2px 5px rgba(0,0,0,0.5); }
    .rank-badge { background: rgba(20, 40, 25, .92); padding: 10px 22px; border-radius: 40px; border: 2px solid #ffd966; color: #ffd966; font-weight: bold; font-size: 1rem; box-shadow: 0 4px 15px rgba(0,0,0,0.5); backdrop-filter: blur(5px); }
    
    .shop { position: fixed; right: 12px; top: 90px; bottom: 12px; width: 220px; background: rgba(15, 32, 20, .94); border: 2px solid #d4af37; border-radius: 20px; padding: 12px; overflow-y: auto; z-index: 10; transition: transform .3s cubic-bezier(.4, 0, .2, 1), opacity .3s; transform-origin: right center; box-shadow: 0 10px 30px rgba(0,0,0,0.7); backdrop-filter: blur(10px); }
    .shop.collapsed { transform: translateX(calc(100% + 20px)); opacity: 0; pointer-events: none; }
    .shop h3 { color: #ffd966; font-size: 1rem; text-align: center; margin-bottom: 10px; border-bottom: 1px solid #8b6914; padding-bottom: 8px; text-shadow: 0 2px 4px #000; }
    .shop-item { background: linear-gradient(180deg, #2a4a30, #1a3320); border-radius: 14px; padding: 8px; margin-bottom: 8px; border: 1px solid #4a6c40; cursor: pointer; transition: .15s; box-shadow: 0 4px 8px rgba(0,0,0,0.4); }
    .shop-item:hover:not(.locked):not(.selected) { background: linear-gradient(180deg, #3a5c42, #24472e); border-color: #ffd966; transform: translateY(-2px); }
    .shop-item.selected { background: linear-gradient(180deg, #3a6c46, #2f5a3a); border-color: #ffd966; box-shadow: 0 0 15px rgba(255, 217, 102, .8); }
    .shop-item.locked { opacity: .4; cursor: not-allowed; filter: grayscale(.7) }
    .shop-top { display: flex; align-items: center; gap: 8px }
    .shop-icon { font-size: 1.6rem; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #0e2414; border-radius: 10px; flex-shrink: 0; box-shadow: inset 0 2px 5px rgba(0,0,0,0.8); }
    .shop-name { color: #ffeaac; font-weight: 600; font-size: .85rem; text-shadow: 0 1px 2px #000; }
    .shop-cost { color: #b8d9a8; font-size: .72rem; margin-top: 2px; }
    .shop-effect { color: #cfcfb0; font-size: .68rem; margin-top: 3px; }
    
    .shop-toggle { position: fixed; right: 12px; top: 52px; z-index: 12; width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(180deg, #dbb42c, #a67c1e); border: 2px solid #ffd966; color: #1e2a0e; font-size: 1.3rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 #7a5d0e, 0 0 15px rgba(255, 217, 102, .6); transition: transform .2s, background .2s; }
    .shop-toggle .icon { transition: transform .3s }
    .shop-toggle.collapsed .icon { transform: rotate(180deg) }
    
    .bar { position: fixed; bottom: 12px; left: 12px; display: flex; gap: 8px; z-index: 10; flex-wrap: wrap }
    .btn { background: rgba(20, 40, 25, .92); border: 2px solid #d4af37; color: #ffd966; padding: 10px 16px; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: .85rem; transition: .15s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); backdrop-filter: blur(5px); }
    .btn:hover { background: #2a4a30; transform: translateY(-1px); }
    .btn.primary { background: linear-gradient(180deg, #dbb42c, #a67c1e); color: #1e2a0e; border-color: #ffd966; box-shadow: 0 4px 0 #7a5d0e, 0 5px 15px rgba(0,0,0,0.6); text-shadow: 0 1px 0 rgba(255,255,255,0.3); }
    .btn.primary:active { transform: translateY(4px); box-shadow: 0 0 0 #7a5d0e; }
    .btn.danger { background: linear-gradient(180deg, #c0392b, #8b1e0e); color: #fff; border-color: #e74c3c; box-shadow: 0 4px 0 #5a0e05, 0 5px 15px rgba(0,0,0,0.6); }
    .btn.danger:active { transform: translateY(4px); box-shadow: 0 0 0 #5a0e05; }
    
    .banner { position: fixed; top: 90px; left: 50%; transform: translateX(-50%); background: rgba(30, 60, 35, .96); border: 2px solid #ffd966; color: #ffeaac; padding: 10px 24px; border-radius: 30px; font-weight: bold; z-index: 11; display: none; text-align: center; max-width: 90%; font-size: .85rem; box-shadow: 0 5px 20px rgba(0,0,0,0.7); backdrop-filter: blur(5px); }
    .banner.demolish { background: rgba(80, 20, 20, .96); border-color: #e74c3c; color: #ffcccc }
    
    .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .85); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; backdrop-filter: blur(5px); }
    .modal-c { background: #274427; border: 4px solid #d4af37; border-radius: 32px; padding: 26px 22px; max-width: 460px; width: 100%; text-align: center; color: #f9f1d2; box-shadow: 0 10px 40px rgba(0,0,0,0.9); }
    .modal-c h3 { font-size: 1.8rem; color: #ffd966; margin-bottom: 12px; text-shadow: 0 2px 5px #000; }
    .blog { background: #1a2e1a; border-radius: 16px; padding: 12px; text-align: left; font-family: monospace; max-height: 220px; overflow-y: auto; margin: 12px 0; font-size: .88rem; line-height: 1.5; box-shadow: inset 0 2px 10px rgba(0,0,0,0.5); }
    .mbtn { background: #dbb42c; border: none; border-radius: 40px; padding: 12px 28px; font-weight: bold; font-size: 1rem; color: #1e2a0e; cursor: pointer; box-shadow: 0 4px 0 #8b6914; margin: 4px; transition: 0.15s; }
    .mbtn:active { transform: translateY(3px); box-shadow: 0 0 0 #8b6914; }
    
    .log { position: fixed; bottom: 70px; left: 12px; width: 300px; max-height: 110px; overflow-y: auto; z-index: 9; background: rgba(10, 25, 15, .85); border: 1px solid #6b8c5c; border-radius: 12px; padding: 8px 12px; font-family: monospace; font-size: .72rem; color: #bbd9a8; pointer-events: none; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    .zoom-ind { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(20, 40, 25, .9); border: 1px solid #d4af37; color: #ffd966; padding: 6px 12px; border-radius: 20px; font-size: .75rem; z-index: 10; font-weight: bold; box-shadow: 0 3px 10px rgba(0,0,0,0.5); }
    .help { position: fixed; top: 90px; left: 12px; background: rgba(15, 32, 20, .94); border: 2px solid #6b8c5c; border-radius: 14px; padding: 10px 14px; color: #bbd9a8; font-size: .72rem; z-index: 9; max-width: 230px; line-height: 1.5; pointer-events: none; transition: opacity .4s; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    .help.hidden { opacity: 0 }
    .forest-badge { position: fixed; top: 52px; left: 12px; z-index: 10; background: rgba(15, 32, 20, .92); border: 2px solid #6b8c5c; border-radius: 30px; padding: 6px 14px; color: #bbd9a8; font-size: .72rem; font-weight: bold; pointer-events: none; transition: border-color .3s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    .forest-badge.growing { border-color: #8bc34a; box-shadow: 0 0 15px rgba(139, 195, 74, .6) }
    .forest-badge b { color: #8bc34a }
    
    body.in-battle .hud, body.in-battle .shop, body.in-battle .shop-toggle, 
    body.in-battle .bar, body.in-battle .forest-badge, body.in-battle .zoom-ind, 
    body.in-battle .help { display: none !important; }

    @media(max-width:720px) {
      .shop { width: 170px; top: 120px }
      .shop h3 { font-size: .85rem }
      .shop-effect { display: none }
      .log { width: 170px; font-size: .6rem }
      .shop-icon { width: 32px; height: 32px; font-size: 1.2rem }
      .res-item { font-size: .7rem }
      .res-item span { min-width: 44px; padding: 2px 8px }
      .help { max-width: 160px; font-size: .62rem }
      .shop-toggle { width: 40px; height: 40px; font-size: 1.1rem; top: 56px }
      .bar .btn { padding: 8px 12px; font-size: .75rem }
      .forest-badge { top: 56px; font-size: .62rem; padding: 4px 10px }
    }
  </style>
</head>
<body class="shop-open">
  <canvas id="cv"></canvas>
  
  <div class="hud">
    <div class="resources">
      <div class="res-item">🪙 <span id="gold">150</span></div>
      <div class="res-item">🪵 <span id="wood">80</span></div>
      <div class="res-item">⚔️ <span id="army">10</span></div>
      <div class="res-item">🏗️ <span id="buildCount">0</span>/30</div>
    </div>
    <div class="rank-badge" id="rank">🏆 Арена 1: Новобранец</div>
  </div>
  <div class="forest-badge" id="forestBadge">🌲 Лес: <b id="treeCount">0</b> / <span id="treeMax">0</span></div>
  <div class="help" id="help">
    <b>Управление:</b><br>🖱️ ЛКМ — постройка/снос<br>🖱️ ПКМ — панорама<br>🖲️ Колесо — зум<br>👆 1 палец — панорама<br>✌️ 2 пальца — зум<br><span style="opacity:.7">(скроется через 8с)</span>
  </div>
  <button class="shop-toggle" id="shopToggle" title="Скрыть/показать постройки"><span class="icon">▶</span></button>
  <div class="shop" id="shop"><h3>🏗️ Постройки</h3><div id="shopList"></div></div>
  <div class="banner" id="banner"></div>
  <div class="bar">
    <button class="btn primary" id="findBtn">⚔️ Бой</button>
    <button class="btn" id="demolishBtn">🗑️ Снести</button>
    <button class="btn" id="zi">➕</button>
    <button class="btn" id="zo">➖</button>
    <button class="btn" id="zr">🎯</button>
    <button class="btn danger" id="resetBtn">🔄</button>
  </div>
  <div class="zoom-ind" id="zoomInd">🔍 70%</div>
  <div class="log" id="log"></div>
  <div class="modal" id="modal">
    <div class="modal-c">
      <h3 id="mtitle">Битва!</h3>
      <div id="mcontent"></div>
      <button class="mbtn" id="mclose">Закрыть</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, remove, onDisconnect, off } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCvr3N350SeY-UImZfqxvRQbte6lhLeA7g",
      authDomain: "kingdom-online-ef88b.firebaseapp.com",
      databaseURL: "https://kingdom-online-ef88b-default-rtdb.firebaseio.com",
      projectId: "kingdom-online-ef88b",
      storageBucket: "kingdom-online-ef88b.firebasestorage.app",
      messagingSenderId: "433616971461",
      appId: "1:433616971461:web:5594746f972dcc294932ac"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const myPlayerId = 'p_' + Math.random().toString(36).substr(2, 9);
    
    (function() {
      'use strict';

      var MAX_BUILDINGS = 30;

      var RANKS = [
        { name: 'Новобранец', maxWins: 3, str: ['house', 'farm', 'lumberMill', 'barracks'] },
        { name: 'Воин', maxWins: 6, str: ['house', 'farm', 'lumberMill', 'barracks', 'blacksmith', 'wall'] },
        { name: 'Рыцарь', maxWins: 10, str: ['house', 'farm', 'lumberMill', 'barracks', 'blacksmith', 'wall', 'market'] },
        { name: 'Барон', maxWins: 15, str: ['house', 'farm', 'lumberMill', 'barracks', 'blacksmith', 'wall', 'market', 'tower'] },
        { name: 'Герцог', maxWins: 22, str: ['house', 'farm', 'lumberMill', 'barracks', 'blacksmith', 'wall', 'market', 'tower', 'castle', 'dragonLair'] },
        { name: 'Король', maxWins: Infinity, str: ['house', 'farm', 'lumberMill', 'barracks', 'blacksmith', 'wall', 'market', 'tower', 'castle', 'dragonLair'] }
      ];

      var S = {
        house: { name: 'Дом', icon: '🏠', cost: { g: 20, w: 10 }, eff: '+2 жителя, +5 армии', type: 'army', per: 5, size: 1, pop: 2 },
        farm: { name: 'Ферма', icon: '🌾', cost: { g: 15, w: 5 }, eff: '+3 золота/с', type: 'goldRate', per: 3, size: 1, pop: 1 },
        lumberMill: { name: 'Лесопилка', icon: '🪓', cost: { g: 30, w: 15 }, eff: '+2 дерева/с, лесоруб', type: 'woodRate', per: 2, size: 1, pop: 1, worker: 'lumberjack' },
        barracks: { name: 'Казармы', icon: '⚔️', cost: { g: 40, w: 25 }, eff: '+10 армии', type: 'army', per: 10, size: 1, pop: 1 },
        blacksmith: { name: 'Кузница', icon: '🔨', cost: { g: 60, w: 40 }, eff: '+15 армии', type: 'army', per: 15, size: 1, pop: 1 },
        wall: { name: 'Стена', icon: '🧱', cost: { g: 50, w: 60 }, eff: '+5 защиты', type: 'defense', per: 5, size: 1, pop: 0 },
        market: { name: 'Рынок', icon: '🏪', cost: { g: 70, w: 50 }, eff: '+5 золота/с', type: 'goldRate', per: 5, size: 1, pop: 2 },
        tower: { name: 'Башня', icon: '🗼', cost: { g: 90, w: 70 }, eff: '+20 армии', type: 'army', per: 20, size: 1, pop: 1 },
        castle: { name: 'Замок', icon: '🏰', cost: { g: 150, w: 120 }, eff: '+30 армии,+10з/с', type: 'mixed', per: 10, size: 2, pop: 5 },
        dragonLair: { name: 'Логово', icon: '🐉', cost: { g: 300, w: 200 }, eff: '+50 армии', type: 'army', per: 50, size: 2, pop: 0 }
      };

      var GS = 60, COLS = 40, ROWS = 28;
      var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
      var MAX_CITIZENS = 80, CHOP_DURATION = 1.0, WOOD_PER_CHOP = 5, ARRIVE_DIST = 16;
      var TREE_INITIAL = 200, TREE_MIN = 80, TREE_MAX = 900;
      var TREE_GROW_BASE = 0.5, TREE_GROW_PER_SEC = 0.006, TREE_GROW_MAX = 4.5;
      var treeGrowTimer = 0, gameTime = 0;

      var state = { gold: 150, wood: 80, army: 10, wins: 0, rankIndex: 0, buildings: [], lastTick: Date.now() };
      var cam = { x: COLS * GS / 2, y: ROWS * GS / 2, zoom: 0.7, minZoom: 0.15, maxZoom: 3.0 };
      var placing = null, demolishMode = false, mouse = { x: 0, y: 0, inside: false };
      
      var trees = [], TREE_TYPES = [
        { name: 'oak', color1: '#2d5016', color2: '#4a7a2e', trunk: '#5c3a1f' },
        { name: 'pine', color1: '#1a4010', color2: '#2d6b1e', trunk: '#4a2e15' },
        { name: 'birch', color1: '#5a8a3a', color2: '#7fb84a', trunk: '#d4c4a8' }
      ];

      var citizens = [];
      var CITIZEN_COLORS = ['#f5cba7', '#e8b88a', '#d4a373', '#c9a17a', '#b8865f'];
      var CITIZEN_SHIRTS = ['#c0392b', '#2980b9', '#27ae60', '#8e44ad', '#d35400', '#f39c12', '#16a085', '#e74c3c'];

      // СИСТЕМА ЧАСТИЦ
      var particles = [];
      function spawnParticles(x, y, count, color, speed, size, life) {
          for(let i=0; i<count; i++) {
              particles.push({
                  x: x, y: y,
                  vx: (Math.random() - 0.5) * speed,
                  vy: (Math.random() - 0.5) * speed,
                  size: Math.random() * size + 1,
                  color: color,
                  life: life + Math.random() * life,
                  maxLife: life
              });
          }
      }

      function updateParticles(dt) {
          for(let i = particles.length - 1; i >= 0; i--) {
              let p = particles[i];
              p.x += p.vx * dt;
              p.y += p.vy * dt;
              p.life -= dt;
              p.vx *= 0.95;
              p.vy *= 0.95;
              if (p.life <= 0) particles.splice(i, 1);
          }
      }

      function drawParticles() {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          for(let p of particles) {
              ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
              ctx.fillStyle = p.color;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
              ctx.fill();
          }
          ctx.restore();
      }

      setInterval(() => {
          if (battleState.active) return;
          let w = s2w(mouse.x || cv.width/2, mouse.y || cv.height/2);
          spawnParticles(w.x + (Math.random()-0.5)*1000/cam.zoom, w.y + (Math.random()-0.5)*1000/cam.zoom, 1, '#ffd966', 10, 2, 3);
      }, 150);

      // ============ БИТВА И ПОИСК ============
      var battleState = { active: false, timer: 0, duration: 6.0, playerWin: false, resultLog: '', playerArmy: 0, enemyArmy: 0, playerBuildings: [], enemyBuildings: [], units: [], clashParticles: false };

      function mulberry32(a) {
        return function() {
          var t = a += 0x6D2B79F5;
          t = Math.imul(t ^ t >>> 15, t | 1);
          t ^= t + Math.imul(t ^ t >>> 7, t | 61);
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        }
      }

      let isMatching = false;
      let matchTimer = null;
      let currentQueueRef = null;
      let currentBattleRef = null;

      function findOpponent() {
        if (isMatching) { 
            // Отмена поиска
            isMatching = false; 
            if (matchTimer) clearInterval(matchTimer);
            if (currentQueueRef) off(currentQueueRef); 
            if (currentBattleRef) off(currentBattleRef);
            remove(ref(db, 'queue_arena_' + state.rankIndex + '/' + myPlayerId)); 
            document.getElementById('findBtn').textContent = '⚔️ Бой'; 
            addLog('🚫 Поиск отменен'); 
            return; 
        }

        isMatching = true; 
        document.getElementById('findBtn').textContent = '⏳ Поиск (3с)...'; 
        addLog('🔎 Поиск на Арене ' + (state.rankIndex + 1) + '...');

        let myBuildings = state.buildings.map(b => ({ type: b.type, gx: b.gx, gy: b.gy, level: b.level }));
        
        let arenaPath = 'queue_arena_' + state.rankIndex;
        let myRef = ref(db, arenaPath + '/' + myPlayerId);
        
        set(myRef, { id: myPlayerId, army: state.army, defense: calcDefense(), buildings: myBuildings });
        onDisconnect(myRef).remove();

        currentQueueRef = ref(db, arenaPath);
        currentBattleRef = ref(db, 'battles/' + myPlayerId);

        let timeLeft = 3;
        matchTimer = setInterval(() => {
            if (!isMatching) return;
            timeLeft--;
            if (timeLeft > 0) {
                document.getElementById('findBtn').textContent = '⏳ Поиск (' + timeLeft + 'с)...';
            } else {
                // Время вышло - призываем бота
                clearInterval(matchTimer);
                off(currentQueueRef);
                remove(myRef);
                startBotMatch();
            }
        }, 1000);

        onValue(currentQueueRef, (snapshot) => {
          if (!isMatching) return;
          const players = snapshot.val(); if (!players) return;
          const oppKeys = Object.keys(players).filter(id => id !== myPlayerId);

          if (oppKeys.length > 0) {
            const oppId = oppKeys[0]; const oppData = players[oppId];
            if (myPlayerId < oppId) {
              isMatching = false; clearInterval(matchTimer); off(currentQueueRef);
              document.getElementById('findBtn').textContent = '⚔️ Бой';
              remove(myRef); remove(ref(db, arenaPath + '/' + oppId));

              let pPower = state.army * (1 + calcDefense() * 0.02); let ePower = oppData.army * (1 + oppData.defense * 0.02);
              let seed = Math.floor((pPower + ePower) * 10000) % 999999; let rand = mulberry32(seed);
              pPower += rand() * 10; ePower += rand() * 10; let hostWin = pPower > ePower;
              let resultObj = { win: hostWin, seed: seed, playerPower: pPower, enemyPower: ePower, enemyArmy: oppData.army, enemyDefense: oppData.defense, hostBuildings: myBuildings, enemyBuildings: oppData.buildings || [] };
              set(ref(db, 'battles/' + oppId), { result: { win: !hostWin, seed: seed, playerPower: ePower, enemyPower: pPower, enemyArmy: state.army, enemyDefense: calcDefense(), enemyBuildings: myBuildings, hostBuildings: oppData.buildings || [] }});
              startBattleAnimation(resultObj);
            }
          }
        });

        onValue(currentBattleRef, (snapshot) => {
          if (!isMatching) return;
          const bData = snapshot.val();
          if (bData && bData.result) {
            isMatching = false; clearInterval(matchTimer); off(currentQueueRef); off(currentBattleRef);
            remove(myRef); remove(currentBattleRef);
            document.getElementById('findBtn').textContent = '⚔️ Бой';
            startBattleAnimation(bData.result);
          }
        });
      }

      // ============ УМНЫЙ БОТ ============
      function startBotMatch() {
          isMatching = false;
          document.getElementById('findBtn').textContent = '⚔️ Бой';
          addLog('🤖 Найден умный бот на Арене ' + (state.rankIndex + 1));
          
          // Бот подстраивается под текущую арену
          let botArmy = 10 + state.rankIndex * 25 + Math.floor(Math.random() * 15);
          let botDefense = state.rankIndex * 5 + Math.floor(Math.random() * 5);
          let allowedBuildings = RANKS[state.rankIndex].str;
          let numBuildings = 4 + state.rankIndex * 3;
          
          let botBuildings = [];
          let slots = [];
          for(let x = 2; x < COLS - 2; x += 4) {
              for(let y = 2; y < ROWS/2 - 2; y += 4) {
                  slots.push({x, y});
              }
          }
          slots.sort(() => Math.random() - 0.5);
          
          for (let i = 0; i < Math.min(numBuildings, slots.length); i++) {
              let bType = allowedBuildings[Math.floor(Math.random() * allowedBuildings.length)];
              botBuildings.push({ type: bType, gx: slots[i].x, gy: slots[i].y, level: 1 });
          }

          let pPower = state.army * (1 + calcDefense() * 0.02);
          let ePower = botArmy * (1 + botDefense * 0.02);
          let seed = Math.floor((pPower + ePower) * 10000) % 999999; let rand = mulberry32(seed);
          pPower += rand() * 10; ePower += rand() * 10; let hostWin = pPower > ePower;

          let resultObj = {
              win: hostWin, seed: seed, playerPower: pPower, enemyPower: ePower,
              enemyArmy: botArmy, enemyDefense: botDefense,
              hostBuildings: state.buildings.map(b => ({ type: b.type, gx: b.gx, gy: b.gy, level: b.level })),
              enemyBuildings: botBuildings
          };

          setTimeout(() => { startBattleAnimation(resultObj); }, 500);
      }

      function calcDefense() {
        var d = 0;
        for (var i = 0; i < state.buildings.length; i++) { var b = state.buildings[i], def = S[b.type]; if (def && def.type === 'defense') d += def.per * (b.level || 0); }
        return d;
      }

      function startBattleAnimation(result) {
        document.body.classList.add('in-battle');
        battleState.active = true; battleState.timer = 0; battleState.playerWin = result.win;
        battleState.playerArmy = state.army; battleState.enemyArmy = result.enemyArmy;
        battleState.playerBuildings = result.hostBuildings || []; battleState.enemyBuildings = result.enemyBuildings || [];
        battleState.units = []; battleState.clashParticles = false; particles = [];
        let rand = mulberry32(result.seed); let totalUnits = 50;
        let myUnits = Math.max(10, Math.floor(totalUnits * (state.army / (state.army + result.enemyArmy + 1)))); let enemyUnits = Math.max(10, totalUnits - myUnits);
        for(let i=0; i<myUnits; i++) battleState.units.push({ side: 'player', x: cv.width / 2 + (rand() - 0.5) * 100, y: cv.height * 0.9 - rand() * 50, targetX: cv.width / 2 + (rand() - 0.5) * 200, targetY: cv.height * 0.5, speed: 80 + rand() * 60, swing: rand() * 10 });
        for(let i=0; i<enemyUnits; i++) battleState.units.push({ side: 'enemy', x: cv.width / 2 + (rand() - 0.5) * 100, y: cv.height * 0.1 + rand() * 50, targetX: cv.width / 2 + (rand() - 0.5) * 200, targetY: cv.height * 0.5, speed: 80 + rand() * 60, swing: rand() * 10 });
        
        let isBot = (result.enemyArmy % 2 === 0 && !result.hasOwnProperty('enemyPower') === false); // Просто проверка
        battleState.resultLog = '⚔️ Против: Живой Игрок<br>🛡️ Ты: ' + Math.floor(state.army) + ' (+защ ' + calcDefense() + ')<br>🛡️ Враг: ' + Math.floor(result.enemyArmy) + ' (+защ ' + result.enemyDefense + ')<br>💥 ' + result.playerPower.toFixed(1) + ' vs ' + result.enemyPower.toFixed(1) + '<br><br>';
      }

      function updateBattle(dt) {
        if (!battleState.active) return;
        battleState.timer += dt;
        if (battleState.timer > 2.5 && battleState.timer < 4.5 && !battleState.clashParticles) { battleState.clashParticles = true; spawnParticles(cv.width/2, cv.height/2, 50, '#ffd700', 300, 4, 1.5); }
        for (let u of battleState.units) {
          if (battleState.timer < 2.5) { let dx = u.targetX - u.x; let dy = u.targetY - u.y; let dist = Math.sqrt(dx*dx + dy*dy); if (dist > 5) { u.x += (dx / dist) * u.speed * dt; u.y += (dy / dist) * u.speed * dt; } }
          else if (battleState.timer < 4.5) { u.x += (Math.random() - 0.5) * 40 * dt; u.y += (Math.random() - 0.5) * 40 * dt; if(Math.random() > 0.9) spawnParticles(u.x, u.y, 1, u.side === 'player' ? '#3498db' : '#e74c3c', 50, 2, 0.5); }
          else { u.x += (u.side === 'player' ? (battleState.playerWin ? 1 : -1) : (battleState.playerWin ? -1 : 1)) * u.speed * dt; }
        }
        if (battleState.timer >= battleState.duration) {
          battleState.active = false; document.body.classList.remove('in-battle');
          if (battleState.playerWin) {
            var gr = 30 + Math.floor(battleState.enemyArmy * 1.2); var wr = 15 + Math.floor(battleState.enemyArmy * 0.8); var loss = Math.floor(battleState.playerArmy * 0.15);
            state.gold += gr; state.wood += wr; state.army = Math.max(5, battleState.playerArmy - loss); state.wins++;
            battleState.resultLog += '🎉 ПОБЕДА!<br>+' + gr + '💰 +' + wr + '🪵<br>-' + loss + ' армии'; addLog('✅ Победа!');
          } else {
            var loss = Math.floor(battleState.playerArmy * 0.4);
            state.army = Math.max(3, battleState.playerArmy - loss); state.gold = Math.max(0, state.gold - 20); state.wood = Math.max(0, state.wood - 15);
            battleState.resultLog += '💀 ПОРАЖЕНИЕ<br>-' + loss + ' армии, -20💰 -15🪵'; addLog('❌ Поражение!');
          }
          checkRank(); save(); updateHUD(); renderShop();
          document.getElementById('mtitle').textContent = battleState.playerWin ? '🏆 Победа!' : '💔 Поражение';
          document.getElementById('mcontent').innerHTML = '<div class="blog">' + battleState.resultLog + '</div>';
          document.getElementById('modal').style.display = 'flex';
        }
      }

      function renderBattle() {
        var w2 = cv.width / 2, h2 = cv.height / 2;
        var bgGrad = ctx.createLinearGradient(0, 0, 0, cv.height); bgGrad.addColorStop(0, '#1a2a3a'); bgGrad.addColorStop(0.5, '#2c1e16'); bgGrad.addColorStop(1, '#0a1a0a'); ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, cv.width, cv.height);
        var fog = ctx.createRadialGradient(w2, h2, 50, w2, h2, cv.width); fog.addColorStop(0, 'rgba(0,0,0,0)'); fog.addColorStop(1, 'rgba(20,10,10,0.8)'); ctx.fillStyle = fog; ctx.fillRect(0, 0, cv.width, cv.height);
        drawVoxelCastle(w2, cv.height * 0.95, true, '#2980b9'); drawVoxelCastle(w2, cv.height * 0.05, false, '#c0392b');
        drawArenaBuildings(battleState.enemyBuildings, true, h2); drawArenaBuildings(battleState.playerBuildings, false, h2);
        for (let u of battleState.units) {
          ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.ellipse(u.x, u.y + 5, 8, 4, 0, 0, Math.PI*2); ctx.fill();
          ctx.shadowColor = u.side === 'player' ? '#3498db' : '#e74c3c'; ctx.shadowBlur = 10;
          ctx.fillStyle = u.side === 'player' ? '#5dade2' : '#f1948a'; ctx.beginPath(); ctx.arc(u.x, u.y, 6, 0, Math.PI * 2); ctx.fill();
          ctx.shadowBlur = 5; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); let swing = Math.sin(battleState.timer * 20 + u.swing) * 15; ctx.moveTo(u.x, u.y-3); ctx.lineTo(u.x, u.y - 15 + (battleState.timer > 2.5 && battleState.timer < 4.5 ? swing : 0)); ctx.stroke(); ctx.shadowBlur = 0;
        }
        drawParticles();
        ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.shadowColor = '#000'; ctx.shadowBlur = 10;
        let text = battleState.timer < 2.5 ? "МАРШ!" : (battleState.timer < 4.5 ? "В БОЙ!" : (battleState.playerWin ? "ПОБЕДА!" : "ПОРАЖЕНИЕ")); ctx.fillText(text, w2, h2); ctx.shadowBlur = 0;
      }

      function drawVoxelCastle(x, y, isPlayer, color) {
        ctx.save(); ctx.translate(x, y);
        ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.beginPath(); ctx.ellipse(0, 10, 60, 20, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#666'; ctx.fillRect(-40, isPlayer ? -60 : 0, 80, 60);

        ctx.fillStyle = color; ctx.beginPath();
        if (isPlayer) { ctx.moveTo(-50, -60); ctx.lineTo(0, -100); ctx.lineTo(50, -60); } else { ctx.moveTo(-50, 60); ctx.lineTo(0, 100); ctx.lineTo(50, 60); }
        ctx.closePath(); ctx.fill();
        ctx.shadowColor = '#ffd966'; ctx.shadowBlur = 15; ctx.fillStyle = '#ffd966'; ctx.fillRect(-10, isPlayer ? -40 : 20, 20, 20); ctx.shadowBlur = 0; ctx.restore();
      }

      function drawArenaBuildings(buildings, isEnemy, midY) {
        if (!buildings || buildings.length === 0) return;
        let scaleX = cv.width / COLS; let scaleY = midY / (ROWS / 2 + 2); 
        buildings.forEach(b => {
            let def = S[b.type]; if (!def) return;
            let bx = b.gx * scaleX + scaleX/2; let by = isEnemy ? (midY - ((ROWS - b.gy) * scaleY) - 20) : (midY + (b.gy * scaleY) + 20);
            if (bx < 0 || bx > cv.width || by < 0 || by > cv.height) return;
            let sz = scaleX * def.size * 0.8; let col = bcolor(b.type);
            ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(bx, by + sz*0.3, sz*0.6, sz*0.3, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = col.l; ctx.fillRect(bx - sz/2, by - sz/2, sz, sz);
            ctx.fillStyle = col.d; ctx.fillRect(bx + sz/2, by - sz/2, sz*0.2, sz);
            ctx.fillStyle = col.r; ctx.beginPath(); ctx.moveTo(bx - sz/2, by - sz/2); ctx.lineTo(bx, by - sz/2 - sz*0.3); ctx.lineTo(bx + sz/2 + sz*0.2, by - sz/2); ctx.closePath(); ctx.fill();
            ctx.font = (sz * 0.6) + 'px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 8; ctx.fillText(def.icon, bx, by); ctx.shadowBlur = 0;
        });
      }

      function drawVoxelBuilding(b) {

        var size = def.size, p = w2s(b.gx * GS, b.gy * GS), ts = GS * size * cam.zoom;
        var col = bcolor(b.type);

        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.ellipse(0, ts * 0.35, ts * 0.45, ts * 0.2, 0, 0, Math.PI * 2); ctx.fill();
        var w = ts * 0.8, h = ts * 0.6, dp = ts * 0.2;
        
        if (b.type === 'house') {
            ctx.fillStyle = col.d; ctx.fillRect(-w/2, -h/2 - dp, w, h);
            ctx.fillStyle = col.l; ctx.fillRect(-w/2, -h/2, w, h);
            ctx.fillStyle = col.r; ctx.beginPath(); ctx.moveTo(-w/2 - dp, -h/2); ctx.lineTo(0, -h/2 - dp*1.5); ctx.lineTo(w/2 + dp, -h/2); ctx.lineTo(w/2, -h/2 + dp); ctx.lineTo(-w/2, -h/2 + dp); ctx.fill();
            ctx.fillStyle = '#5c3a1f'; ctx.fillRect(-w*0.15, -h*0.1, w*0.3, h*0.4);
            ctx.shadowColor = '#ffd966'; ctx.shadowBlur = 10; ctx.fillStyle = '#ffd966'; ctx.fillRect(-w*0.35, -h*0.3, w*0.2, h*0.2); ctx.shadowBlur = 0;
        } else if (b.type === 'farm') {

            ctx.fillStyle = '#4a7a2e'; for(let i=0; i<4; i++) ctx.fillRect(-w/2 + 5, -h/4 + 5 + i*8, w-10, 3);
            ctx.fillStyle = '#2980b9'; ctx.fillRect(-w/2, h/4, w, 4);
        } else if (b.type === 'lumberMill') {
            ctx.fillStyle = col.d; ctx.fillRect(-w/2, -h/2, w, h);
            ctx.fillStyle = col.l; ctx.fillRect(-w/2, -h/2, w/2, h);
            ctx.fillStyle = col.r; ctx.beginPath(); ctx.moveTo(-w/2, -h/2); ctx.lineTo(0, -h/2 - dp); ctx.lineTo(w/2, -h/2); ctx.fill();
            ctx.fillStyle = '#8b6914'; ctx.fillRect(w*0.2, h*0.1, w*0.3, 6); ctx.fillRect(w*0.2, h*0.2, w*0.3, 6);
            ctx.strokeStyle = '#bdc3c7'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI); ctx.stroke();
        } else if (b.type === 'barracks') {
            ctx.fillStyle = '#696969'; ctx.fillRect(-w/2, -h/3, w, h*0.8);
            ctx.fillStyle = '#8b0000'; ctx.beginPath(); ctx.moveTo(-w/2, -h/3); ctx.lineTo(0, -h/3 - dp*1.5); ctx.lineTo(w/2, -h/3); ctx.fill();
            ctx.strokeStyle = '#bdc3c7'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 20); ctx.moveTo(10, 0); ctx.lineTo(-10, 20); ctx.stroke();
        } else if (b.type === 'blacksmith') {
            ctx.fillStyle = '#404040'; ctx.fillRect(-w/2, -h/2, w, h);
            ctx.fillStyle = '#2f2f2f'; ctx.fillRect(w*0.1, -h/2 - 15, 10, 15);
            ctx.shadowColor = '#ff4500'; ctx.shadowBlur = 20; ctx.fillStyle = '#ff4500'; ctx.fillRect(-w*0.3, -h*0.1, w*0.2, h*0.2); ctx.shadowBlur = 0;

        } else if (b.type === 'wall') {

            for(let i=0; i<w; i+=10) { ctx.fillStyle = i%20===0 ? '#e74c3c' : '#ecf0f1'; ctx.fillRect(-w/2 + i, -h/2 - 5, 10, 15); }

            ctx.fillStyle = '#a9a9a9'; ctx.fillRect(-w/2, -h/2, w*0.2, h*1.2); ctx.fillRect(w/2 - w*0.2, -h/2, w*0.2, h*1.2);
            ctx.fillStyle = '#4a4a6a'; ctx.beginPath(); ctx.moveTo(-w/2, -h/2); ctx.lineTo(-w/2 + w*0.1, -h*0.8); ctx.lineTo(-w/2 + w*0.2, -h/2); ctx.fill();
            ctx.beginPath(); ctx.moveTo(w/2 - w*0.2, -h/2); ctx.lineTo(w/2 - w*0.1, -h*0.8); ctx.lineTo(w/2, -h/2); ctx.fill();
        } else if (b.type === 'dragonLair') {
            ctx.fillStyle = '#4a0000'; ctx.beginPath(); ctx.moveTo(-w/2, h/2); ctx.lineTo(-w/3, -h/3); ctx.lineTo(w/3, -h/3); ctx.lineTo(w/2, h/2); ctx.fill();
            ctx.strokeStyle = '#ecf0f1'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-10, 10); ctx.lineTo(10, 10); ctx.stroke();
            ctx.shadowColor = '#ff4500'; ctx.shadowBlur = 15; ctx.fillStyle = '#ff4500'; ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
        }
        ctx.font = ts * 0.25 + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#fff'; ctx.shadowColor = 'black'; ctx.shadowBlur = 4; ctx.fillText(def.icon, 0, -h * 0.6); ctx.shadowBlur = 0;

      function drawVoxelTree(t) {
        var p = w2s(t.x, t.y), z = cam.zoom;
        if (p.x < -100 || p.x > cv.width + 100 || p.y < -150 || p.y > cv.height + 100) return;
        var grown = t.growDur > 0 ? Math.min(1, t.age / t.growDur) : 1;
        var sway = Math.sin(t.phase + performance.now() * 0.001 * t.sway) * 0.05;
        var sz = t.size * GS * z * 0.55 * (0.3 + 0.7 * grown);
        var def = TREE_TYPES[t.type];
        ctx.save(); ctx.globalAlpha = 0.4 + 0.6 * grown; ctx.translate(p.x, p.y);
        ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(sz*0.2, sz*0.2, sz*0.5, sz*0.2, 0, 0, Math.PI*2); ctx.fill();
        if (t.chopPhase > 0) { t.chopPhase -= 0.5; ctx.translate(Math.sin(t.chopPhase * 30) * 3 * z, 0); }
        ctx.fillStyle = def.trunk; ctx.fillRect(-sz*0.1, -sz*0.4, sz*0.2, sz*0.5);
        ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(sz*0.05, -sz*0.4, sz*0.05, sz*0.5);
        ctx.rotate(sway); ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 10;
        ctx.fillStyle = def.color1; ctx.fillRect(-sz*0.5, -sz*0.8, sz*1.0, sz*0.6); ctx.fillRect(-sz*0.3, -sz*1.1, sz*0.6, sz*0.4);
        ctx.fillStyle = def.color2; ctx.fillRect(-sz*0.4, -sz*0.7, sz*0.3, sz*0.3); ctx.fillRect(-sz*0.2, -sz*1.0, sz*0.3, sz*0.2);
        ctx.restore();
      }

      function drawVoxelGround() {
        var tl = s2w(0, 0), br = s2w(cv.width, cv.height);
        var minX = Math.max(0, Math.floor(tl.x / GS) - 1), maxX = Math.min(COLS, Math.ceil(br.x / GS) + 1);
        var minY = Math.max(0, Math.floor(tl.y / GS) - 1), maxY = Math.min(ROWS, Math.ceil(br.y / GS) + 1);
        for (var gy = minY; gy < maxY; gy++) {
          for (var gx = minX; gx < maxX; gx++) {
            var p = w2s(gx * GS, gy * GS), cs = GS * cam.zoom;
            var hash = (gx * 7 + gy * 13) % 5; var shades = ['#4a7a42', '#45713e', '#4f8047', '#427039', '#527d45'];
            ctx.fillStyle = shades[hash]; ctx.fillRect(p.x, p.y, cs + 1, cs + 1);
            ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = Math.max(1, cam.zoom); ctx.strokeRect(p.x, p.y, cs, cs);
            if (cam.zoom > 0.5 && hash === 0 && Math.random() > 0.7) { ctx.fillStyle = '#6b9e58'; ctx.fillRect(p.x + cs*0.2, p.y + cs*0.6, 2, 4); ctx.fillRect(p.x + cs*0.7, p.y + cs*0.4, 2, 3); }
          }
        }
        var ttl = w2s(0, 0), tbr = w2s(COLS * GS, ROWS * GS); ctx.save(); ctx.fillStyle = 'rgba(10,20,10,0.85)';
        ctx.fillRect(0, 0, cv.width, Math.max(0, ttl.y));
        if (tbr.y < cv.height) ctx.fillRect(0, tbr.y, cv.width, cv.height - tbr.y);
        if (ttl.x > 0) ctx.fillRect(0, Math.max(0, ttl.y), Math.max(0, ttl.x), Math.min(cv.height, tbr.y) - Math.max(0, ttl.y));
        if (tbr.x < cv.width) ctx.fillRect(tbr.x, Math.max(0, ttl.y), cv.width - tbr.x, Math.min(cv.height, tbr.y) - Math.max(0, ttl.y));
        ctx.restore();
        ctx.strokeStyle = '#d4af37'; ctx.lineWidth = Math.max(2, 3 * cam.zoom); ctx.shadowColor = '#ffd966'; ctx.shadowBlur = 15;
        ctx.setLineDash([15 * cam.zoom, 10 * cam.zoom]); ctx.strokeRect(ttl.x, ttl.y, tbr.x - ttl.x, tbr.y - ttl.y); ctx.setLineDash([]); ctx.shadowBlur = 0;
      }

      function drawShaderOverlay() {
        ctx.save(); ctx.globalCompositeOperation = 'screen';
        var sunGrad = ctx.createRadialGradient(cv.width*0.8, 0, 100, cv.width*0.8, 0, cv.width);
        sunGrad.addColorStop(0, 'rgba(255, 240, 150, 0.15)'); sunGrad.addColorStop(1, 'rgba(255, 240, 150, 0)');
        ctx.fillStyle = sunGrad; ctx.fillRect(0, 0, cv.width, cv.height); ctx.restore();
        var vig = ctx.createRadialGradient(cv.width/2, cv.height/2, cv.height*0.4, cv.width/2, cv.height/2, cv.height*1.2);
        vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.6)'); ctx.fillStyle = vig; ctx.fillRect(0, 0, cv.width, cv.height);
      }

      function makeTreeAt(gx, gy) {
        if (gx < 0 || gx >= COLS || gy < 0 || gy >= ROWS) return false;
        if (anyOcc(gx, gy, 1)) return false;

        var bId = 'b' + Date.now() + Math.random().toString(36).slice(2, 6);
        state.buildings.push({ id: bId, type: placing, gx: gx, gy: gy, level: 1 });
        if (def.type === 'army') state.army += def.per; if (def.type === 'mixed') state.army += def.per * 3;
        if (def.pop) { for (var i = 0; i < def.pop; i++) { var role = def.worker || 'wander'; spawnCitizen(bId, gx + (size - 1) / 2, gy + (size - 1) / 2, role); } }
        let p = w2s(gx * GS + GS/2, gy * GS + GS/2); spawnParticles(p.x, p.y, 20, '#d4a574', 100, 4, 1);
        addLog('✅ ' + def.name + ' построен'); save(); updateHUD(); placing = null; updateBanner(); renderShop();
      }

      function demolishBuilding(gx, gy) {
        if (battleState.active) return; var b = buildingAt(gx, gy); if (!b) { addLog('❌ Здесь нет здания'); return; }
        var def = S[b.type], refundG = Math.floor(def.cost.g * 0.5), refundW = Math.floor(def.cost.w * 0.5);
        state.gold += refundG; state.wood += refundW; citizens = citizens.filter(function(c) { return c.homeId !== b.id; });
        if (def.type === 'army') state.army = Math.max(0, state.army - def.per); if (def.type === 'mixed') state.army = Math.max(0, state.army - def.per * 3);
        var idx = state.buildings.indexOf(b); if (idx >= 0) state.buildings.splice(idx, 1);
        let p = w2s(b.gx * GS + GS/2, b.gy * GS + GS/2); spawnParticles(p.x, p.y, 30, '#8b6b3f', 150, 5, 1.5);
        addLog('🗑️ ' + def.name + ' снесён +' + refundG + '💰'); save(); updateHUD(); demolishMode = false; updateBanner(); renderShop();
      }

      function zoomAt(sx, sy, factor) {
        if (battleState.active) return; var old = cam.zoom, nz = Math.max(cam.minZoom, Math.min(cam.maxZoom, old * factor)); if (nz === old) return;
        var before = s2w(sx, sy); cam.zoom = nz; var after = s2w(sx, sy); cam.x += before.x - after.x; cam.y += before.y - after.y; updateHUD();
      }

      var mousePanning = false, mousePanStartX = 0, mousePanStartY = 0, mouseCamStartX = 0, mouseCamStartY = 0, mouseMoved = false;
      cv.addEventListener('wheel', function(e) { e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.15 : 1 / 1.15); }, { passive: false });
      cv.addEventListener('mousemove', function(e) { mouse.x = e.clientX; mouse.y = e.clientY; mouse.inside = true; if (mousePanning) { var dx = e.clientX - mousePanStartX, dy = e.clientY - mousePanStartY; if (Math.abs(dx) + Math.abs(dy) > 3) mouseMoved = true; cam.x = mouseCamStartX - dx / cam.zoom; cam.y = mouseCamStartY - dy / cam.zoom; } });
      cv.addEventListener('mouseleave', function() { mouse.inside = false; });
      cv.addEventListener('mousedown', function(e) { if (e.button === 2) { e.preventDefault(); mousePanning = true; mousePanStartX = e.clientX; mousePanStartY = e.clientY; mouseCamStartX = cam.x; mouseCamStartY = cam.y; mouseMoved = false; } });
      cv.addEventListener('mouseup', function(e) { if (e.button === 2) { mousePanning = false; if (!mouseMoved) { if (placing) { placing = null; updateBanner(); renderShop(); addLog('🚫 Отменено'); } if (demolishMode) { demolishMode = false; updateBanner(); addLog('🚫 Отменено'); } } } });
      cv.addEventListener('contextmenu', function(e) { e.preventDefault(); });

      var touches = {}, touchMode = null, panStart = { x: 0, y: 0, camX: 0, camY: 0 }, pinchStart = { dist: 0, camX: 0, camY: 0, zoom: 0, midWorldX: 0, midWorldY: 0 }, touchHasMoved = false, touchStartTime = 0, touchStartPos = { x: 0, y: 0 }, TAP_MAX_TIME = 300, TAP_MAX_DIST = 20;
      function getTouchIds() { return Object.keys(touches).map(Number); }
      function getTwoTouches() { var ids = getTouchIds(); if (ids.length < 2) return null; return [touches[ids[0]], touches[ids[1]]]; }
      function tdist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
      function tmid(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }

      cv.addEventListener('touchstart', function(e) {
        e.preventDefault(); for (var i = 0; i < e.changedTouches.length; i++) { var t = e.changedTouches[i]; touches[t.identifier] = { x: t.clientX, y: t.clientY }; }
        var ids = getTouchIds();
        if (ids.length === 1) { var t0 = touches[ids[0]]; touchMode = 'pan'; panStart.x = t0.x; panStart.y = t0.y; panStart.camX = cam.x; panStart.camY = cam.y; touchHasMoved = false; touchStartTime = Date.now(); touchStartPos.x = t0.x; touchStartPos.y = t0.y; }
        else if (ids.length >= 2) { var pair = getTwoTouches(), m = tmid(pair[0], pair[1]), w = s2w(m.x, m.y); touchMode = 'pinch'; pinchStart.dist = tdist(pair[0], pair[1]); pinchStart.camX = cam.x; pinchStart.camY = cam.y; pinchStart.zoom = cam.zoom; pinchStart.midWorldX = w.x; pinchStart.midWorldY = w.y; touchHasMoved = true; }
      }, { passive: false });

      cv.addEventListener('touchmove', function(e) {
        e.preventDefault(); for (var i = 0; i < e.changedTouches.length; i++) { var t = e.changedTouches[i]; if (touches[t.identifier]) touches[t.identifier] = { x: t.clientX, y: t.clientY }; }
        var ids = getTouchIds();
        if (touchMode === 'pan' && ids.length === 1) { var t0 = touches[ids[0]], dx = t0.x - panStart.x, dy = t0.y - panStart.y; if (Math.abs(dx) + Math.abs(dy) > 6) touchHasMoved = true; cam.x = panStart.camX - dx / cam.zoom; cam.y = panStart.camY - dy / cam.zoom; }
        else if (touchMode === 'pinch' && ids.length >= 2) { var pair = getTwoTouches(), newDist = tdist(pair[0], pair[1]), m = tmid(pair[0], pair[1]); if (pinchStart.dist > 0 && newDist > 0) { var factor = newDist / pinchStart.dist, nz = Math.max(cam.minZoom, Math.min(cam.maxZoom, pinchStart.zoom * factor)); cam.zoom = nz; cam.x = pinchStart.midWorldX - (m.x - cv.width / 2) / cam.zoom; cam.y = pinchStart.midWorldY - (m.y - cv.height / 2) / cam.zoom; updateHUD(); } }
        else if (ids.length >= 2 && touchMode === 'pan') { var pair2 = getTwoTouches(), m2 = tmid(pair2[0], pair2[1]), w2 = s2w(m2.x, m2.y); touchMode = 'pinch'; pinchStart.dist = tdist(pair2[0], pair2[1]); pinchStart.camX = cam.x; pinchStart.camY = cam.y; pinchStart.zoom = cam.zoom; pinchStart.midWorldX = w2.x; pinchStart.midWorldY = w2.y; }
      }, { passive: false });

      cv.addEventListener('touchend', function(e) {
        e.preventDefault(); for (var i = 0; i < e.changedTouches.length; i++) { delete touches[e.changedTouches[i].identifier]; }
        var ids = getTouchIds();
        if (ids.length === 0) {
          if (touchMode === 'pan' && !touchHasMoved && (Date.now() - touchStartTime) < TAP_MAX_TIME) {
            if (battleState.active) return; mouse.x = touchStartPos.x; mouse.y = touchStartPos.y; mouse.inside = true;
            var g = s2g(mouse.x, mouse.y); if (demolishMode) demolishBuilding(g.gx, g.gy); else if (placing) tryPlace(g.gx, g.gy);
          }
          touchMode = null; touchHasMoved = false;
        } else if (ids.length === 1) { var t0 = touches[ids[0]]; touchMode = 'pan'; panStart.x = t0.x; panStart.y = t0.y; panStart.camX = cam.x; panStart.camY = cam.y; touchHasMoved = true; }
      }, { passive: false });

      cv.addEventListener('touchcancel', function(e) { e.preventDefault(); for (var i = 0; i < e.changedTouches.length; i++) { delete touches[e.changedTouches[i].identifier]; } if (getTouchIds().length === 0) { touchMode = null; touchHasMoved = false; } }, { passive: false });

      cv.addEventListener('click', function(e) { if (battleState.active) { battleState.timer = battleState.duration; return; } if (mousePanning || mouseMoved) return; var g = s2g(e.clientX, e.clientY); if (demolishMode) demolishBuilding(g.gx, g.gy); else if (placing) tryPlace(g.gx, g.gy); });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') { if (placing) { placing = null; updateBanner(); renderShop(); } if (demolishMode) { demolishMode = false; updateBanner(); } }
        if (e.key === 'h' || e.key === 'H' || e.key === 'р' || e.key === 'Р') { setShopCollapsed(!shopCollapsed, true); }
      });

      document.getElementById('zi').onclick = function() { zoomAt(cv.width / 2, cv.height / 2, 1.25); };
      document.getElementById('zo').onclick = function() { zoomAt(cv.width / 2, cv.height / 2, 1 / 1.25); };
      document.getElementById('zr').onclick = function() { cam.x = COLS * GS / 2; cam.y = ROWS * GS / 2; cam.zoom = 0.7; updateHUD(); };
      document.getElementById('demolishBtn').onclick = function() { if (demolishMode) { demolishMode = false; addLog('🚫 Снос отменён'); } else { placing = null; demolishMode = true; addLog('🗑️ Режим сноса'); } updateBanner(); renderShop(); };

      function resetGame() {
        if (!confirm('Удалить всё и начать заново?')) return;
        try { localStorage.removeItem('kr19'); } catch (e) {}
        state = { gold: 150, wood: 80, army: 10, wins: 0, rankIndex: 0, buildings: [], lastTick: Date.now() };
        citizens = []; placing = null; demolishMode = false; gameTime = 0; treeGrowTimer = 0; generateTrees();
        cam.x = COLS * GS / 2; cam.y = ROWS * GS / 2; cam.zoom = 0.7; updateBanner(); renderShop(); updateHUD();
        addLog('🔄 Игра сброшена. Лес снова растёт!');
      }
      document.getElementById('resetBtn').onclick = resetGame;

      function checkRank() {
        var r = curRank();
        if (r.maxWins !== Infinity && state.wins >= r.maxWins && state.rankIndex < RANKS.length - 1) { state.rankIndex++; addLog('🎉 Переход на Арену ' + (state.rankIndex + 1) + ': ' + RANKS[state.rankIndex].name); renderShop(); }
      }
      
      document.getElementById('findBtn').onclick = findOpponent;
      document.getElementById('mclose').onclick = function() { document.getElementById('modal').style.display = 'none'; battleState.active = false; document.body.classList.remove('in-battle'); };

      load(); generateTrees();
      for (var i = 0; i < state.buildings.length; i++) {
        var b = state.buildings[i], def = S[b.type];
        if (def && def.pop) { var existing = citizens.filter(function(c) { return c.homeId === b.id; }).length; for (var j = existing; j < def.pop * (b.level || 1); j++) { spawnCitizen(b.id, b.gx + (def.size - 1) / 2, b.gy + (def.size - 1) / 2, def.worker || 'wander'); } }
      }
      renderShop(); updateHUD();
      addLog('🏁 Игра загружена. Вы на Арене ' + (state.rankIndex + 1));
      
      setTimeout(function() { var h = document.getElementById('help'); if (h) h.classList.add('hidden'); }, 8000);

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('sw.js').then(function(reg) {
            console.log('ServiceWorker зарегистрирован!');
            reg.onupdatefound = function() { var installingWorker = reg.installing; installingWorker.onstatechange = function() { if (installingWorker.state === 'installed') { if (navigator.serviceWorker.controller) window.location.reload(); } }; };
          }, function(err) { console.log('Ошибка ServiceWorker: ', err); });
        });
      }
    })();
  </script>
</body>
