<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1">
  <title>Kingdom Runner — Forest Regrowth</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1e12">

  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1e12; touch-action: none }
    canvas { display: block; cursor: crosshair; touch-action: none }
    
    .hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; gap: 12px; pointer-events: none; z-index: 10; flex-wrap: wrap }
    .hud>* { pointer-events: auto }
    .resources { display: flex; gap: 10px; background: rgba(20, 40, 25, .92); padding: 10px 18px; border-radius: 40px; border: 2px solid #d4af37; flex-wrap: wrap }
    .res-item { color: #f5e6b0; font-weight: bold; display: flex; align-items: center; gap: 6px; font-size: .85rem }
    .res-item span { background: #0e2b18; padding: 3px 12px; border-radius: 20px; min-width: 60px; text-align: center; border: 1px solid #8b6914; color: #fff8e7 }
    .rank-badge { background: rgba(20, 40, 25, .92); padding: 10px 22px; border-radius: 40px; border: 2px solid #ffd966; color: #ffd966; font-weight: bold; font-size: 1rem }
    
    .shop { position: fixed; right: 12px; top: 90px; bottom: 12px; width: 220px; background: rgba(15, 32, 20, .94); border: 2px solid #d4af37; border-radius: 20px; padding: 12px; overflow-y: auto; z-index: 10; transition: transform .3s cubic-bezier(.4, 0, .2, 1), opacity .3s; transform-origin: right center; }
    .shop.collapsed { transform: translateX(calc(100% + 20px)); opacity: 0; pointer-events: none; }
    .shop h3 { color: #ffd966; font-size: 1rem; text-align: center; margin-bottom: 10px; border-bottom: 1px solid #8b6914; padding-bottom: 8px }
    .shop-item { background: #1a3320; border-radius: 14px; padding: 8px; margin-bottom: 8px; border: 1px solid #6b8c5c; cursor: pointer; transition: .15s }
    .shop-item:hover:not(.locked):not(.selected) { background: #24472e; border-color: #ffd966 }
    .shop-item.selected { background: #2f5a3a; border-color: #ffd966; box-shadow: 0 0 12px rgba(255, 217, 102, .6) }
    .shop-item.locked { opacity: .4; cursor: not-allowed; filter: grayscale(.7) }
    .shop-top { display: flex; align-items: center; gap: 8px }
    .shop-icon { font-size: 1.6rem; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #0e2414; border-radius: 10px; flex-shrink: 0 }
    .shop-name { color: #ffeaac; font-weight: 600; font-size: .85rem }
    .shop-cost { color: #b8d9a8; font-size: .72rem; margin-top: 2px }
    .shop-effect { color: #cfcfb0; font-size: .68rem; margin-top: 3px }
    
    .shop-toggle { position: fixed; right: 12px; top: 52px; z-index: 12; width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(180deg, #dbb42c, #a67c1e); border: 2px solid #ffd966; color: #1e2a0e; font-size: 1.3rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 #7a5d0e, 0 0 15px rgba(255, 217, 102, .4); transition: transform .2s, background .2s; }
    .shop-toggle .icon { transition: transform .3s }
    .shop-toggle.collapsed .icon { transform: rotate(180deg) }
    
    .bar { position: fixed; bottom: 12px; left: 12px; display: flex; gap: 8px; z-index: 10; flex-wrap: wrap }
    .btn { background: rgba(20, 40, 25, .92); border: 2px solid #d4af37; color: #ffd966; padding: 10px 16px; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: .85rem; transition: .15s }
    .btn.primary { background: linear-gradient(180deg, #dbb42c, #a67c1e); color: #1e2a0e; border-color: #ffd966; box-shadow: 0 3px 0 #7a5d0e }
    .btn.danger { background: linear-gradient(180deg, #c0392b, #8b1e0e); color: #fff; border-color: #e74c3c; box-shadow: 0 3px 0 #5a0e05 }
    
    .banner { position: fixed; top: 90px; left: 50%; transform: translateX(-50%); background: rgba(30, 60, 35, .96); border: 2px solid #ffd966; color: #ffeaac; padding: 10px 24px; border-radius: 30px; font-weight: bold; z-index: 11; display: none; text-align: center; max-width: 90%; font-size: .85rem }
    .banner.demolish { background: rgba(80, 20, 20, .96); border-color: #e74c3c; color: #ffcccc }
    
    .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .85); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px }
    .modal-c { background: #274427; border: 4px solid #d4af37; border-radius: 32px; padding: 26px 22px; max-width: 460px; width: 100%; text-align: center; color: #f9f1d2 }
    .modal-c h3 { font-size: 1.8rem; color: #ffd966; margin-bottom: 12px }
    .blog { background: #1a2e1a; border-radius: 16px; padding: 12px; text-align: left; font-family: monospace; max-height: 220px; overflow-y: auto; margin: 12px 0; font-size: .88rem; line-height: 1.5 }
    .mbtn { background: #dbb42c; border: none; border-radius: 40px; padding: 12px 28px; font-weight: bold; font-size: 1rem; color: #1e2a0e; cursor: pointer; box-shadow: 0 4px 0 #8b6914; margin: 4px }
    
    .log { position: fixed; bottom: 70px; left: 12px; width: 300px; max-height: 110px; overflow-y: auto; z-index: 9; background: rgba(10, 25, 15, .85); border: 1px solid #6b8c5c; border-radius: 12px; padding: 8px 12px; font-family: monospace; font-size: .72rem; color: #bbd9a8; pointer-events: none }
    .zoom-ind { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(20, 40, 25, .9); border: 1px solid #d4af37; color: #ffd966; padding: 6px 12px; border-radius: 20px; font-size: .75rem; z-index: 10; font-weight: bold }
    .help { position: fixed; top: 90px; left: 12px; background: rgba(15, 32, 20, .94); border: 2px solid #6b8c5c; border-radius: 14px; padding: 10px 14px; color: #bbd9a8; font-size: .72rem; z-index: 9; max-width: 230px; line-height: 1.5; pointer-events: none; transition: opacity .4s }
    .help.hidden { opacity: 0 }
    .forest-badge { position: fixed; top: 52px; left: 12px; z-index: 10; background: rgba(15, 32, 20, .92); border: 2px solid #6b8c5c; border-radius: 30px; padding: 6px 14px; color: #bbd9a8; font-size: .72rem; font-weight: bold; pointer-events: none; transition: border-color .3s; }
    .forest-badge.growing { border-color: #8bc34a; box-shadow: 0 0 10px rgba(139, 195, 74, .4) }
    .forest-badge b { color: #8bc34a }
    
    /* Скрываем интерфейс во время битвы */
    body.in-battle .hud, body.in-battle .shop, body.in-battle .shop-toggle, 
    body.in-battle .bar, body.in-battle .forest-badge, body.in-battle .zoom-ind, 
    body.in-battle .help { display: none !important; }

    @media(max-width:720px) {
      .shop { width: 170px; top: 120px }
      .shop h3 { font-size: .85rem }
      .shop-effect { display: none }
      .log { width: 170px; font-size: .6rem }
      .shop-icon { width: 32px; height: 32px; font-size: 1.2rem }
      .res-item { font-size: .7rem }
      .res-item span { min-width: 44px; padding: 2px 8px }
      .help { max-width: 160px; font-size: .62rem }
      .shop-toggle { width: 40px; height: 40px; font-size: 1.1rem; top: 56px }
      .bar .btn { padding: 8px 12px; font-size: .75rem }
      .forest-badge { top: 56px; font-size: .62rem; padding: 4px 10px }
    }
  </style>
</head>
<body class="shop-open">
  <canvas id="cv"></canvas>
  
  <div class="hud">
    <div class="resources">
      <div class="res-item">🪙 <span id="gold">150</span></div>
      <div class="res-item">🪵 <span id="wood">80</span></div>
      <div class="res-item">⚔️ <span id="army">10</span></div>
      <div class="res-item">🏗️ <span id="buildCount">0</span>/30</div> <!-- Лимит построек -->
    </div>
    <div class="rank-badge" id="rank">🏆 Ранг 1: Новобранец</div>
  </div>
  <div class="forest-badge" id="forestBadge">🌲 Лес: <b id="treeCount">0</b> / <span id="treeMax">0</span></div>
  <div class="help" id="help">
    <b>Управление:</b><br>🖱️ ЛКМ — постройка/снос<br>🖱️ ПКМ — панорама<br>🖲️ Колесо — зум<br>👆 1 палец — панорама<br>✌️ 2 пальца — зум<br><span style="opacity:.7">(скроется через 8с)</span>
  </div>
  <button class="shop-toggle" id="shopToggle" title="Скрыть/показать постройки"><span class="icon">▶</span></button>
  <div class="shop" id="shop"><h3>🏗️ Постройки</h3><div id="shopList"></div></div>
  <div class="banner" id="banner"></div>
  <div class="bar">
    <button class="btn primary" id="findBtn">⚔️ Бой</button>
    <button class="btn" id="demolishBtn">🗑️ Снести</button>
    <button class="btn" id="zi">➕</button>
    <button class="btn" id="zo">➖</button>
    <button class="btn" id="zr">🎯</button>
    <button class="btn danger" id="resetBtn">🔄</button>
  </div>
  <div class="zoom-ind" id="zoomInd">🔍 70%</div>
  <div class="log" id="log"></div>
  <div class="modal" id="modal">
    <div class="modal-c">
      <h3 id="mtitle">Битва!</h3>
      <div id="mcontent"></div>
      <button class="mbtn" id="mclose">Закрыть</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, remove, onDisconnect, off } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCvr3N350SeY-UImZfqxvRQbte6lhLeA7g",
      authDomain: "kingdom-online-ef88b.firebaseapp.com",
      databaseURL: "https://kingdom-online-ef88b-default-rtdb.firebaseio.com",
      projectId: "kingdom-online-ef88b",
      storageBucket: "kingdom-online-ef88b.firebasestorage.app",
      messagingSenderId: "433616971461",
      appId: "1:433616971461:web:5594746f972dcc294932ac"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const myPlayerId = 'p_' + Math.random().toString(36).substr(2, 9);
    
    (function() {
      'use strict';

      // ЛИМИТ ПОСТРОЕК
      var MAX_BUILDINGS = 30;

      var RANKS = [
        { name: 'Новобранец', maxWins: 3, str: ['house', 'farm', 'lumberMill', 'barracks'] },
        { name: 'Воин', maxWins: 6, str: ['house', 'farm', 'lumberMill', 'barracks', 'blacksmith', 'wall'] },
        { name: 'Рыцарь', maxWins: 10, str: ['house', 'farm', 'lumberMill', 'barracks', 'blacksmith', 'wall', 'market'] },
        { name: 'Барон', maxWins: 15, str: ['house', 'farm', 'lumberMill', 'barracks', 'blacksmith', 'wall', 'market', 'tower'] },
        { name: 'Герцог', maxWins: 22, str: ['house', 'farm', 'lumberMill', 'barracks', 'blacksmith', 'wall', 'market', 'tower', 'castle', 'dragonLair'] },
        { name: 'Король', maxWins: Infinity, str: ['house', 'farm', 'lumberMill', 'barracks', 'blacksmith', 'wall', 'market', 'tower', 'castle', 'dragonLair'] }
      ];

      var S = {
        house: { name: 'Дом', icon: '🏠', cost: { g: 20, w: 10 }, eff: '+2 жителя, +5 армии', type: 'army', per: 5, size: 1, pop: 2 },
        farm: { name: 'Ферма', icon: '🌾', cost: { g: 15, w: 5 }, eff: '+3 золота/с', type: 'goldRate', per: 3, size: 1, pop: 1 },
        lumberMill: { name: 'Лесопилка', icon: '🪓', cost: { g: 30, w: 15 }, eff: '+2 дерева/с, лесоруб', type: 'woodRate', per: 2, size: 1, pop: 1, worker: 'lumberjack' },
        barracks: { name: 'Казармы', icon: '⚔️', cost: { g: 40, w: 25 }, eff: '+10 армии', type: 'army', per: 10, size: 1, pop: 1 },
        blacksmith: { name: 'Кузница', icon: '🔨', cost: { g: 60, w: 40 }, eff: '+15 армии', type: 'army', per: 15, size: 1, pop: 1 },
        wall: { name: 'Стена', icon: '🧱', cost: { g: 50, w: 60 }, eff: '+5 защиты', type: 'defense', per: 5, size: 1, pop: 0 },
        market: { name: 'Рынок', icon: '🏪', cost: { g: 70, w: 50 }, eff: '+5 золота/с', type: 'goldRate', per: 5, size: 1, pop: 2 },
        tower: { name: 'Башня', icon: '🗼', cost: { g: 90, w: 70 }, eff: '+20 армии', type: 'army', per: 20, size: 1, pop: 1 },
        castle: { name: 'Замок', icon: '🏰', cost: { g: 150, w: 120 }, eff: '+30 армии,+10з/с', type: 'mixed', per: 10, size: 2, pop: 5 },
        dragonLair: { name: 'Логово', icon: '🐉', cost: { g: 300, w: 200 }, eff: '+50 армии', type: 'army', per: 50, size: 2, pop: 0 }
      };

      var GS = 60, COLS = 40, ROWS = 28;
      var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
      var MAX_CITIZENS = 80, CHOP_DURATION = 1.0, WOOD_PER_CHOP = 5, ARRIVE_DIST = 16;
      var TREE_INITIAL = 200, TREE_MIN = 80, TREE_MAX = 900;
      var TREE_GROW_BASE = 0.5, TREE_GROW_PER_SEC = 0.006, TREE_GROW_MAX = 4.5;
      var treeGrowTimer = 0, gameTime = 0;

      var state = { gold: 150, wood: 80, army: 10, wins: 0, rankIndex: 0, buildings: [], lastTick: Date.now() };
      var cam = { x: COLS * GS / 2, y: ROWS * GS / 2, zoom: 0.7, minZoom: 0.15, maxZoom: 3.0 };
      var placing = null, demolishMode = false, mouse = { x: 0, y: 0, inside: false };
      var trees = [], TREE_TYPES = [
        { name: 'oak', color1: '#2d5016', color2: '#4a7a2e', trunk: '#5c3a1f' },
        { name: 'pine', color1: '#1a4010', color2: '#2d6b1e', trunk: '#4a2e15' },
        { name: 'birch', color1: '#5a8a3a', color2: '#7fb84a', trunk: '#d4c4a8' }
      ];

      var citizens = [];
      var CITIZEN_COLORS = ['#f5cba7', '#e8b88a', '#d4a373', '#c9a17a', '#b8865f'];
      var CITIZEN_SHIRTS = ['#c0392b', '#2980b9', '#27ae60', '#8e44ad', '#d35400', '#f39c12', '#16a085', '#e74c3c'];

      // ============ СИСТЕМА АРЕНЫ (CLASH ROYALE) ============
      var battleState = {
        active: false,
        timer: 0,
        duration: 7.0,
        playerWin: false,
        resultLog: '',
        playerArmy: 0,
        enemyArmy: 0,
        playerBuildings: [],
        enemyBuildings: [],
        units: []
      };

      function mulberry32(a) {
        return function() {
          var t = a += 0x6D2B79F5;
          t = Math.imul(t ^ t >>> 15, t | 1);
          t ^= t + Math.imul(t ^ t >>> 7, t | 61);
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        }
      }

      let isMatching = false;
      const queueRef = ref(db, 'queue');
      const myBattleRef = ref(db, 'battles/' + myPlayerId);

      function findOpponent() {
        if (isMatching) {
          isMatching = false;
          off(queueRef);
          remove(ref(db, 'queue/' + myPlayerId));
          document.getElementById('findBtn').textContent = '⚔️ Бой';
          addLog('🚫 Поиск отменен');
          return;
        }

        isMatching = true;
        document.getElementById('findBtn').textContent = '⏳ Поиск...';
        addLog('🔎 Поиск соперника...');

        // ОТПРАВЛЯЕМ ВСЕ ПОСТРОЙКИ С КООРДИНАТАМИ
        let myBuildings = state.buildings.map(b => ({ type: b.type, gx: b.gx, gy: b.gy, level: b.level }));
        
        set(ref(db, 'queue/' + myPlayerId), { 
            id: myPlayerId, 
            army: state.army, 
            defense: calcDefense(),
            buildings: myBuildings
        });
        onDisconnect(ref(db, 'queue/' + myPlayerId)).remove();

        onValue(queueRef, (snapshot) => {
          if (!isMatching) return;
          const players = snapshot.val();
          if (!players) return;

          const oppKeys = Object.keys(players).filter(id => id !== myPlayerId);

          if (oppKeys.length > 0) {
            const oppId = oppKeys[0];
            const oppData = players[oppId];

            if (myPlayerId < oppId) {
              isMatching = false;
              off(queueRef);
              document.getElementById('findBtn').textContent = '⚔️ Бой';

              remove(ref(db, 'queue/' + myPlayerId));
              remove(ref(db, 'queue/' + oppId));

              let pPower = state.army * (1 + calcDefense() * 0.02);
              let ePower = oppData.army * (1 + oppData.defense * 0.02);
              
              let seed = Math.floor((pPower + ePower) * 10000) % 999999; 
              let rand = mulberry32(seed);
              pPower += rand() * 10;
              ePower += rand() * 10;
              
              let hostWin = pPower > ePower;

              let resultObj = {
                win: hostWin,
                seed: seed,
                playerPower: pPower,
                enemyPower: ePower,
                enemyArmy: oppData.army,
                enemyDefense: oppData.defense,
                hostBuildings: myBuildings,
                enemyBuildings: oppData.buildings || []
              };

              set(ref(db, 'battles/' + oppId), { 
                result: { 
                  win: !hostWin, 
                  seed: seed,
                  playerPower: ePower, 
                  enemyPower: pPower, 
                  enemyArmy: state.army, 
                  enemyDefense: calcDefense(),
                  enemyBuildings: myBuildings, 
                  hostBuildings: oppData.buildings || []
                } 
              });
              
              startBattleAnimation(resultObj);
            }
          }
        });

        onValue(myBattleRef, (snapshot) => {
          if (!isMatching) return;
          const bData = snapshot.val();
          if (bData && bData.result) {
            isMatching = false;
            off(queueRef);
            off(myBattleRef);
            remove(ref(db, 'queue/' + myPlayerId));
            remove(myBattleRef);
            document.getElementById('findBtn').textContent = '⚔️ Бой';
            
            startBattleAnimation(bData.result);
          }
        });
      }

      function calcDefense() {
        var d = 0;
        for (var i = 0; i < state.buildings.length; i++) {
          var b = state.buildings[i], def = S[b.type];
          if (def && def.type === 'defense') d += def.per * (b.level || 0);
        }
        return d;
      }

      function startBattleAnimation(result) {
        document.body.classList.add('in-battle');
        battleState.active = true;
        battleState.timer = 0;
        battleState.playerWin = result.win;
        battleState.playerArmy = state.army;
        battleState.enemyArmy = result.enemyArmy;
        battleState.playerBuildings = result.hostBuildings || [];
        battleState.enemyBuildings = result.enemyBuildings || [];
        battleState.units = [];

        let rand = mulberry32(result.seed);

        let totalUnits = 60;
        let myUnits = Math.max(10, Math.floor(totalUnits * (state.army / (state.army + result.enemyArmy + 1))));
        let enemyUnits = Math.max(10, totalUnits - myUnits);

        // Войска игрока появляются слева (внизу их замка)
        for(let i=0; i<myUnits; i++) {
          battleState.units.push({
            side: 'player',
            x: cv.width * 0.25 + (rand() - 0.5) * 100, // Спавн из замка игрока
            y: cv.height * 0.8 + (rand() - 0.5) * 100,
            targetX: cv.width / 2,
            targetY: cv.height / 2,
            speed: 70 + rand() * 50,
            offset: rand() * 10
          });
        }
        // Войска врага появляются справа (вверху их замка)
        for(let i=0; i<enemyUnits; i++) {
          battleState.units.push({
            side: 'enemy',
            x: cv.width * 0.75 + (rand() - 0.5) * 100, // Спавн из замка врага
            y: cv.height * 0.2 + (rand() - 0.5) * 100,
            targetX: cv.width / 2,
            targetY: cv.height / 2,
            speed: 70 + rand() * 50,
            offset: rand() * 10
          });
        }

        battleState.resultLog = '⚔️ Против: Живой Игрок<br>';
        battleState.resultLog += '🛡️ Ты: ' + Math.floor(state.army) + ' (+защ ' + calcDefense() + ')<br>';
        battleState.resultLog += '🛡️ Враг: ' + Math.floor(result.enemyArmy) + ' (+защ ' + result.enemyDefense + ')<br>';
        battleState.resultLog += '💥 ' + result.playerPower.toFixed(1) + ' vs ' + result.enemyPower.toFixed(1) + '<br><br>';
      }

      function updateBattle(dt) {
        if (!battleState.active) return;
        battleState.timer += dt;

        // Движение войск к центру
        for (let u of battleState.units) {
          if (battleState.timer < 3.0) {
            let dx = u.targetX - u.x;
            let dy = u.targetY - u.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > 10) {
              u.x += (dx / dist) * u.speed * dt;
              u.y += (dy / dist) * u.speed * dt;
            }
          } else if (battleState.timer < 5.0) {
             // Схватка (тряска)
             u.x += (Math.random() - 0.5) * 20 * dt;
             u.y += (Math.random() - 0.5) * 20 * dt;
          } else {
             // Отступление / Погоня
             if (u.side === 'player') {
                 u.x += (battleState.playerWin ? 1 : -1) * u.speed * 0.8 * dt;
             } else {

      // Отрисовка арены с сохранением позиций зданий
      function renderBattle() {
        var w2 = cv.width / 2;
        var h2 = cv.height / 2;

        // Фон (Верх - Враг, Низ - Игрок)
        ctx.fillStyle = '#2a1a1a'; // Верх (Враг)
        ctx.fillRect(0, 0, cv.width, h2);
        ctx.fillStyle = '#1a2a1a'; // Низ (Игрок)
        ctx.fillRect(0, h2, cv.width, h2);
        
        // Река / Граница
        ctx.fillStyle = '#3498db';
        ctx.fillRect(0, h2 - 10, cv.width, 20);

        // Масштаб для отрисовки сетки 40x28 на половине экрана
        var scaleX = cv.width / COLS;
        var scaleY = h2 / ROWS;

        // Рисуем постройки врага (верхняя половина)
        battleState.enemyBuildings.forEach(b => {
            let bx = b.gx * scaleX + scaleX/2;
            let by = (ROWS - 1 - b.gy) * scaleY + scaleY/2; // Инвертируем Y для врага
            drawArenaBuilding(bx, by, b.type, scaleX, '#c0392b');
        });

        // Замок врага
        ctx.font = '40px Arial'; ctx.textAlign = 'center';
        ctx.fillText('🏰', w2, h2 / 2);

        // Рисуем постройки игрока (нижняя половина)
        battleState.playerBuildings.forEach(b => {
            let bx = b.gx * scaleX + scaleX/2;
            let by = h2 + b.gy * scaleY + scaleY/2; // Y относительно низа
            drawArenaBuilding(bx, by, b.type, scaleX, '#2980b9');
        });

        // Замок игрока
        ctx.fillText('🏰', w2, h2 + h2 / 2);

        // Войска
        for (let u of battleState.units) {
          ctx.fillStyle = u.side === 'player' ? '#3498db' : '#e74c3c';
          ctx.beginPath();
          ctx.arc(u.x, u.y, 6, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.strokeStyle = '#bdc3c7';
          ctx.lineWidth = 2;
          ctx.beginPath();
          let swing = Math.sin(battleState.timer * 10 + u.offset) * 5;
          let dir = u.side === 'player' ? -1 : 1; // Меч в сторону врага
          ctx.moveTo(u.x, u.y-4);
          ctx.lineTo(u.x, u.y - 12 + swing);
          ctx.stroke();
        }

        // Текст статуса
        let timerText = battleState.timer < 3 ? "Марш..." : (battleState.timer < 5 ? "Битва!" : (battleState.playerWin ? "Победа!" : "Поражение..."));
        ctx.font = 'bold 30px sans-serif';
        ctx.fillStyle = '#ffd966';
        ctx.shadowColor = 'black'; ctx.shadowBlur = 5;
        ctx.fillText(timerText, cv.width / 2, cv.height * 0.1);
        ctx.shadowBlur = 0;
      }

      function drawArenaBuilding(x, y, type, cellSize, color) {
          let def = S[type];
          if(!def) return;
          let sz = cellSize * def.size * 0.8;
          
          ctx.fillStyle = color;
          ctx.fillRect(x - sz/2, y - sz/2, sz, sz);
          ctx.strokeStyle = 'rgba(0,0,0,0.5)';
          ctx.lineWidth = 2;
          ctx.strokeRect(x - sz/2, y - sz/2, sz, sz);
          
          ctx.font = (sz * 0.6) + 'px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = '#fff';
          ctx.fillText(def.icon, x, y);
      }

      // ============ ОСТАЛЬНАЯ ИГРА ============
      function makeTreeAt(gx, gy) {
        if (gx < 0 || gx >= COLS || gy < 0 || gy >= ROWS) return false;
        if (anyOcc(gx, gy, 1)) return false;
        for (var i = 0; i < trees.length; i++) { if (Math.floor(trees[i].x / GS) === gx && Math.floor(trees[i].y / GS) === gy) return false; }
        var type = Math.floor(Math.random() * TREE_TYPES.length);
        trees.push({ gx: gx, gy: gy, x: gx * GS + GS / 2 + (Math.random() - 0.5) * GS * 0.6, y: gy * GS + GS / 2 + (Math.random() - 0.5) * GS * 0.6, size: 0.55 + Math.random() * 0.5, phase: Math.random() * Math.PI * 2, sway: 0.5 + Math.random() * 0.5, type: type, hp: 3, chopPhase: 0, choppedBy: null, age: 0, growDur: 2 + Math.random() * 2 });
        return true;
      }

      function generateTrees() {
        trees = []; var target = TREE_INITIAL, attempts = 0;
        while (trees.length < target && attempts < 8000) {
          attempts++;
          var gx = Math.floor(Math.random() * COLS), gy = Math.floor(Math.random() * ROWS);
          var dCenter = Math.sqrt(Math.pow(gx - COLS / 2, 2) + Math.pow(gy - ROWS / 2, 2));
          if (dCenter < 3) continue;
          if (anyOcc(gx, gy, 1)) continue;
          var blocked = false;
          for (var i = 0; i < trees.length; i++) { if (Math.floor(trees[i].x / GS) === gx && Math.floor(trees[i].y / GS) === gy) { blocked = true; break; } }
          if (blocked) continue;
          var type = Math.floor(Math.random() * TREE_TYPES.length);
          trees.push({ gx: gx, gy: gy, x: gx * GS + GS / 2 + (Math.random() - 0.5) * GS * 0.6, y: gy * GS + GS / 2 + (Math.random() - 0.5) * GS * 0.6, size: 0.75 + Math.random() * 0.6, phase: Math.random() * Math.PI * 2, sway: 0.5 + Math.random() * 0.5, type: type, hp: 3, chopPhase: 0, choppedBy: null, age: 99, growDur: 0 });
        }
      }

      function growOneTree() {
        if (trees.length >= TREE_MAX) return false;
        for (var attempt = 0; attempt < 30; attempt++) {
          var gx = Math.floor(Math.random() * COLS), gy = Math.floor(Math.random() * ROWS);
          if (makeTreeAt(gx, gy)) return true;
        }
        return false;
      }

      function currentGrowRate() { var rate = TREE_GROW_BASE + gameTime * TREE_GROW_PER_SEC; return Math.min(rate, TREE_GROW_MAX); }

      function updateForest(dt) {
        gameTime += dt;
        for (var i = 0; i < trees.length; i++) { var t = trees[i]; if (t.age < t.growDur) t.age += dt; }
        var rate = currentGrowRate(); treeGrowTimer += rate * dt;
        while (treeGrowTimer >= 1) { treeGrowTimer -= 1; growOneTree(); }
        if (trees.length < TREE_MIN) { var toGrow = Math.min(TREE_MIN - trees.length, 3); for (var k = 0; k < toGrow; k++) growOneTree(); }
      }

      function updateForestHUD() {

      function w2s(wx, wy) { return { x: (wx - cam.x) * cam.zoom + cv.width / 2, y: (wy - cam.y) * cam.zoom + cv.height / 2 }; }
      function s2w(sx, sy) { return { x: (sx - cv.width / 2) / cam.zoom + cam.x, y: (sy - cv.height / 2) / cam.zoom + cam.y }; }
      function s2g(sx, sy) { var w = s2w(sx, sy); return { gx: Math.floor(w.x / GS), gy: Math.floor(w.y / GS) }; }
      function resize() { cv.width = innerWidth; cv.height = innerHeight; }
      addEventListener('resize', resize); resize();
      function curRank() { return RANKS[Math.min(state.rankIndex, RANKS.length - 1)]; }

      function occupied(gx, gy) {
        for (var i = 0; i < state.buildings.length; i++) { var b = state.buildings[i], s = S[b.type].size; if (gx >= b.gx && gx < b.gx + s && gy >= b.gy && gy < b.gy + s) return true; }

      function anyOcc(gx, gy, size) { for (var x = gx; x < gx + size; x++) for (var y = gy; y < gy + size; y++) if (occupied(x, y)) return true; return false; }
      function treeAtIndex(gx, gy) { for (var i = 0; i < trees.length; i++) { if (Math.floor(trees[i].x / GS) === gx && Math.floor(trees[i].y / GS) === gy) return i; } return -1; }
      function buildingAt(gx, gy) { for (var i = 0; i < state.buildings.length; i++) { var b = state.buildings[i], s = S[b.type].size; if (gx >= b.gx && gx < b.gx + s && gy >= b.gy && gy < b.gy + s) return b; } return null; }

      function save() {
        try { localStorage.setItem('kr19', JSON.stringify({ gold: state.gold, wood: state.wood, army: state.army, wins: state.wins, rankIndex: state.rankIndex, buildings: state.buildings, gameTime: gameTime, shopCollapsed: document.getElementById('shop').classList.contains('collapsed') })); } catch (e) {}
      }

      function load() {

      var shopCollapsed = false;
      function setShopCollapsed(collapsed, animate) {

        else { shop.classList.remove('collapsed'); toggle.classList.remove('collapsed'); icon.textContent = '▶'; document.body.classList.add('shop-open'); }

      function spawnCitizen(homeId, gx, gy, role) {
        role = role || 'wander';
        if (citizens.length >= MAX_CITIZENS) {
          if (role === 'lumberjack') {
            var wi = -1; for (var i = 0; i < citizens.length; i++) if (citizens[i].role === 'wander') { wi = i; break; }
            if (wi >= 0) citizens.splice(wi, 1); else return null;
          } else return null;
        }
        var c = { x: gx * GS + GS / 2 + (Math.random() - 0.5) * GS * 0.5, y: gy * GS + GS / 2 + (Math.random() - 0.5) * GS * 0.5, tx: gx * GS + GS / 2, ty: gy * GS + GS / 2, speed: 90 + Math.random() * 40, skin: CITIZEN_COLORS[(Math.random() * CITIZEN_COLORS.length) | 0], shirt: CITIZEN_SHIRTS[(Math.random() * CITIZEN_SHIRTS.length) | 0], phase: Math.random() * Math.PI * 2, homeId: homeId, dir: 1, pauseTimer: 0, role: role, targetTree: null, choppingTimer: 0, carrying: false, stuckTimer: 0, lastX: 0, lastY: 0, retargetTimer: 0 };
        if (c.role === 'lumberjack') { c.lastX = c.x; c.lastY = c.y; findNearestTree(c); } else pickWanderTarget(c);
        citizens.push(c); return c;
      }

      function findNearestTree(c) {

        var best = null, bestD = Infinity;
        for (var i = 0; i < trees.length; i++) { var t = trees[i]; if (t.hp <= 0) continue; var dx = t.x - c.x, dy = t.y - c.y, d = dx * dx + dy * dy; if (d < bestD) { bestD = d; best = t; } }
        if (best) { c.targetTree = best; c.tx = best.x; c.ty = best.y; c.choppingTimer = 0; return true; }
        c.targetTree = null; return false;
      }

      function pickWanderTarget(c) {
        c.tx = GS * 1.5 + Math.random() * (COLS * GS - GS * 3); c.ty = GS * 1.5 + Math.random() * (ROWS * GS - GS * 3);
        c.targetTree = null; c.pauseTimer = 0.4 + Math.random() * 1.4; c.lastX = c.x; c.lastY = c.y; c.stuckTimer = 0;
      }

      function updateCitizens(dt) {
        if (dt > 0.2) dt = 0.2;
        for (var i = 0; i < citizens.length; i++) {
          var c = citizens[i];
          if (c.choppingTimer > 0) {
            c.choppingTimer -= dt; c.phase += dt * 22;
            if (c.targetTree) c.targetTree.chopPhase += dt * 15;
            if (c.choppingTimer <= 0) {
              if (c.targetTree && c.targetTree.hp > 0) {
                c.targetTree.hp--; state.wood += WOOD_PER_CHOP; c.carrying = true;
                if (c.targetTree.hp <= 0) { var idx = trees.indexOf(c.targetTree); if (idx >= 0) trees.splice(idx, 1); c.targetTree = null; c.carrying = false; }
              }
              c.choppingTimer = 0;
              if (c.role === 'lumberjack') { if (!findNearestTree(c)) { pickWanderTarget(c); c.pauseTimer = 2 + Math.random() * 3; } }
            }
            continue;
          }
          if (c.pauseTimer > 0) { c.pauseTimer -= dt; c.phase += dt * 1.5; if (c.pauseTimer < 0) c.pauseTimer = 0; continue; }

              if (c.retargetTimer >= 0.4) { c.retargetTimer = 0; if (!findNearestTree(c)) { pickWanderTarget(c); c.pauseTimer = 2 + Math.random() * 3; } }
            } else { c.retargetTimer = 0; c.tx = c.targetTree.x; c.ty = c.targetTree.y; }
          }

      }

      function drawTree(t) {
        var p = w2s(t.x, t.y), z = cam.zoom;
        if (p.x < -80 || p.x > cv.width + 80 || p.y < -120 || p.y > cv.height + 80) return;

        var growScale = 0.3 + 0.7 * grown;
        var sway = Math.sin(t.phase + performance.now() * 0.001 * t.sway) * 0.03;
        var sz = t.size * GS * z * 0.55 * growScale;

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('sw.js').then(function(reg) {
            console.log('ServiceWorker зарегистрирован!');
            reg.onupdatefound = function() {
              var installingWorker = reg.installing;
              installingWorker.onstatechange = function() {
                if (installingWorker.state === 'installed') {
                  if (navigator.serviceWorker.controller) window.location.reload();
                }
              };
            };
          }, function(err) { console.log('Ошибка ServiceWorker: ', err); });
        });
      }
    })();
  </script>
</body>
</html>
