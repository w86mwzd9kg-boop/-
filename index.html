<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1">
  <title>Kingdom Runner — Interactive Battles</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1e12">

  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1e12; touch-action: none }
    canvas { display: block; cursor: crosshair; touch-action: none }

    .hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; gap: 12px; pointer-events: none; z-index: 10; flex-wrap: wrap }
    .hud>* { pointer-events: auto }
    .resources { display: flex; gap: 10px; background: rgba(20,40,25,.92); padding: 10px 18px; border-radius: 40px; border: 2px solid #d4af37; flex-wrap: wrap; box-shadow: 0 4px 15px rgba(0,0,0,.5); backdrop-filter: blur(5px) }
    .res-item { color: #f5e6b0; font-weight: bold; display: flex; align-items: center; gap: 6px; font-size: .85rem }
    .res-item span { background: #0e2b18; padding: 3px 12px; border-radius: 20px; min-width: 60px; text-align: center; border: 1px solid #8b6914; color: #fff8e7; box-shadow: inset 0 2px 5px rgba(0,0,0,.5) }
    .rank-badge { background: rgba(20,40,25,.92); padding: 10px 22px; border-radius: 40px; border: 2px solid #ffd966; color: #ffd966; font-weight: bold; font-size: 1rem; box-shadow: 0 4px 15px rgba(0,0,0,.5); backdrop-filter: blur(5px) }

    .shop { position: fixed; right: 12px; top: 90px; bottom: 12px; width: 220px; background: rgba(15,32,20,.94); border: 2px solid #d4af37; border-radius: 20px; padding: 12px; overflow-y: auto; z-index: 10; transition: transform .3s, opacity .3s; box-shadow: 0 10px 30px rgba(0,0,0,.7); backdrop-filter: blur(10px) }
    .shop.collapsed { transform: translateX(calc(100% + 20px)); opacity: 0; pointer-events: none }
    .shop h3 { color: #ffd966; font-size: 1rem; text-align: center; margin-bottom: 10px; border-bottom: 1px solid #8b6914; padding-bottom: 8px; text-shadow: 0 2px 4px #000 }
    .shop-item { background: linear-gradient(180deg, #2a4a30, #1a3320); border-radius: 14px; padding: 8px; margin-bottom: 8px; border: 1px solid #4a6c40; cursor: pointer; transition: .15s; box-shadow: 0 4px 8px rgba(0,0,0,.4) }
    .shop-item:hover:not(.locked):not(.selected) { background: linear-gradient(180deg, #3a5c42, #24472e); border-color: #ffd966; transform: translateY(-2px) }
    .shop-item.selected { background: linear-gradient(180deg, #3a6c46, #2f5a3a); border-color: #ffd966; box-shadow: 0 0 15px rgba(255,217,102,.8) }
    .shop-item.locked { opacity: .4; cursor: not-allowed; filter: grayscale(.7) }
    .shop-top { display: flex; align-items: center; gap: 8px }
    .shop-icon { font-size: 1.6rem; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #0e2414; border-radius: 10px; flex-shrink: 0; box-shadow: inset 0 2px 5px rgba(0,0,0,.8) }
    .shop-name { color: #ffeaac; font-weight: 600; font-size: .85rem; text-shadow: 0 1px 2px #000 }
    .shop-cost { color: #b8d9a8; font-size: .72rem; margin-top: 2px }
    .shop-effect { color: #cfcfb0; font-size: .68rem; margin-top: 3px }

    .shop-toggle { position: fixed; right: 12px; top: 52px; z-index: 12; width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(180deg, #dbb42c, #a67c1e); border: 2px solid #ffd966; color: #1e2a0e; font-size: 1.3rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 #7a5d0e, 0 0 15px rgba(255,217,102,.6); transition: transform .2s }
    .shop-toggle .icon { transition: transform .3s }
    .shop-toggle.collapsed .icon { transform: rotate(180deg) }

    .bar { position: fixed; bottom: 12px; left: 12px; display: flex; gap: 8px; z-index: 10; flex-wrap: wrap; max-width: calc(100% - 24px) }
    .btn { background: rgba(20,40,25,.92); border: 2px solid #d4af37; color: #ffd966; padding: 10px 16px; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: .85rem; transition: .15s; box-shadow: 0 4px 10px rgba(0,0,0,.5); backdrop-filter: blur(5px) }
    .btn:hover { background: #2a4a30; transform: translateY(-1px) }
    .btn.primary { background: linear-gradient(180deg, #dbb42c, #a67c1e); color: #1e2a0e; border-color: #ffd966; box-shadow: 0 4px 0 #7a5d0e, 0 5px 15px rgba(0,0,0,.6); text-shadow: 0 1px 0 rgba(255,255,255,.3) }
    .btn.primary:active { transform: translateY(4px); box-shadow: 0 0 0 #7a5d0e }
    .btn.danger { background: linear-gradient(180deg, #c0392b, #8b1e0e); color: #fff; border-color: #e74c3c; box-shadow: 0 4px 0 #5a0e05, 0 5px 15px rgba(0,0,0,.6) }
    .btn.danger:active { transform: translateY(4px); box-shadow: 0 0 0 #5a0e05 }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none }

    .banner { position: fixed; top: 90px; left: 50%; transform: translateX(-50%); background: rgba(30,60,35,.96); border: 2px solid #ffd966; color: #ffeaac; padding: 10px 24px; border-radius: 30px; font-weight: bold; z-index: 11; display: none; text-align: center; max-width: 90%; font-size: .85rem; box-shadow: 0 5px 20px rgba(0,0,0,.7); backdrop-filter: blur(5px) }
    .banner.demolish { background: rgba(80,20,20,.96); border-color: #e74c3c; color: #ffcccc }
    .banner small { display: block; font-weight: normal; font-size: .7rem; opacity: .8; margin-top: 4px }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; backdrop-filter: blur(5px) }
    .modal-c { background: #274427; border: 4px solid #d4af37; border-radius: 32px; padding: 26px 22px; max-width: 460px; width: 100%; text-align: center; color: #f9f1d2; box-shadow: 0 10px 40px rgba(0,0,0,.9) }
    .modal-c h3 { font-size: 1.8rem; color: #ffd966; margin-bottom: 12px; text-shadow: 0 2px 5px #000 }
    .blog { background: #1a2e1a; border-radius: 16px; padding: 12px; text-align: left; font-family: monospace; max-height: 300px; overflow-y: auto; margin: 12px 0; font-size: .88rem; line-height: 1.6; box-shadow: inset 0 2px 10px rgba(0,0,0,.5) }
    .blog .stat { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed #3a5c42 }
    .blog .stat:last-child { border-bottom: none }
    .blog .win { color: #8bc34a; font-weight: bold }
    .blog .lose { color: #e74c3c; font-weight: bold }
    .mbtn { background: #dbb42c; border: none; border-radius: 40px; padding: 12px 28px; font-weight: bold; font-size: 1rem; color: #1e2a0e; cursor: pointer; box-shadow: 0 4px 0 #8b6914; margin: 4px; transition: .15s }
    .mbtn:active { transform: translateY(3px); box-shadow: 0 0 0 #8b6914 }

    .log { position: fixed; bottom: 70px; left: 12px; width: 300px; max-height: 110px; overflow-y: auto; z-index: 9; background: rgba(10,25,15,.85); border: 1px solid #6b8c5c; border-radius: 12px; padding: 8px 12px; font-family: monospace; font-size: .72rem; color: #bbd9a8; pointer-events: none; box-shadow: 0 5px 15px rgba(0,0,0,.5) }
    .zoom-ind { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(20,40,25,.9); border: 1px solid #d4af37; color: #ffd966; padding: 6px 12px; border-radius: 20px; font-size: .75rem; z-index: 10; font-weight: bold; box-shadow: 0 3px 10px rgba(0,0,0,.5) }
    .help { position: fixed; top: 90px; left: 12px; background: rgba(15,32,20,.94); border: 2px solid #6b8c5c; border-radius: 14px; padding: 10px 14px; color: #bbd9a8; font-size: .72rem; z-index: 9; max-width: 230px; line-height: 1.5; pointer-events: none; transition: opacity .4s; box-shadow: 0 5px 15px rgba(0,0,0,.5) }
    .help.hidden { opacity: 0 }
    .forest-badge { position: fixed; top: 52px; left: 12px; z-index: 10; background: rgba(15,32,20,.92); border: 2px solid #6b8c5c; border-radius: 30px; padding: 6px 14px; color: #bbd9a8; font-size: .72rem; font-weight: bold; pointer-events: none; transition: border-color .3s; box-shadow: 0 4px 10px rgba(0,0,0,.5) }
    .forest-badge.growing { border-color: #8bc34a; box-shadow: 0 0 15px rgba(139,195,74,.6) }
    .forest-badge b { color: #8bc34a }

    /* BATTLE UI */
    .battle-ui { position: fixed; inset: 0; z-index: 50; display: none; pointer-events: none; flex-direction: column; justify-content: space-between; padding: 12px; transition: opacity .3s }
    .battle-ui > * { pointer-events: auto }
    .battle-top { display: flex; flex-direction: column; gap: 8px; align-items: center }
    .battle-status { display: flex; gap: 16px; align-items: center; background: rgba(20,20,30,.92); padding: 8px 20px; border-radius: 30px; border: 2px solid #ffd966; box-shadow: 0 4px 20px rgba(0,0,0,.7); backdrop-filter: blur(8px) }
    .battle-status #battleTitle { color: #ffd966; font-weight: bold; font-size: 1rem; text-shadow: 0 0 10px rgba(255,217,102,.5) }
    .battle-status #battleTimer { color: #fff; font-weight: bold; font-size: 1.1rem; font-family: monospace }
    .battle-status #battleTimer.warn { color: #e74c3c; animation: pulse .8s infinite }
    @keyframes pulse { 50% { opacity: .5 } }
    .battle-progress-bar { position: relative; width: min(420px, 90vw); height: 26px; background: rgba(0,0,0,.7); border-radius: 15px; border: 2px solid #8b6914; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,.7), inset 0 2px 5px rgba(0,0,0,.8) }
    .battle-progress-fill { height: 100%; background: linear-gradient(90deg, #c0392b, #f39c12, #8bc34a); width: 0%; transition: width .3s; box-shadow: 0 0 20px rgba(139,195,74,.6) }
    .battle-progress-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-size: .8rem; text-shadow: 1px 1px 3px #000, 0 0 5px #000; letter-spacing: 1px }
    .battle-stats { display: flex; gap: 16px; background: rgba(20,20,30,.85); padding: 5px 16px; border-radius: 20px; color: #fff; font-size: .78rem; backdrop-filter: blur(5px) }
    .battle-stats b { color: #ffd966 }
    .battle-bottom { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding-bottom: 4px }
    .battle-btn { padding: 12px 20px; font-size: .9rem; min-width: 100px; text-align: center }

    body.in-battle .hud, body.in-battle .shop, body.in-battle .shop-toggle,
    body.in-battle .bar, body.in-battle .forest-badge, body.in-battle .zoom-ind,
    body.in-battle .help, body.in-battle .log, body.in-battle .banner { display: none !important }
    body.in-battle .battle-ui { display: flex }

    @media(max-width:720px) {
      .shop { width: 170px; top: 120px }
      .shop-effect { display: none }
      .shop-icon { width: 32px; height: 32px; font-size: 1.2rem }
      .res-item { font-size: .7rem }
      .res-item span { min-width: 44px; padding: 2px 8px }
      .bar .btn { padding: 8px 12px; font-size: .75rem }
      .battle-btn { padding: 10px 14px; font-size: .78rem; min-width: 80px }
      .battle-progress-bar { height: 22px }
      .battle-status { padding: 6px 14px; font-size: .85rem }
    }
  </style>
</head>

    import { getDatabase, ref, set, onValue, remove, onDisconnect, off } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const db = getDatabase(app);
    const myPlayerId = 'p_' + Math.random().toString(36).substr(2, 9);

    (function() {
      'use strict';

      const MAX_BUILDINGS = 30;
      const GS = 60, COLS = 40, ROWS = 28;
      const MAX_CITIZENS = 80, CHOP_DURATION = 1.0, WOOD_PER_CHOP = 5, ARRIVE_DIST = 16;

      // ============ ДЕРЕВЬЯ ============
      function makeTreeAt(gx, gy) {
        if (gx < 0 || gx >= COLS || gy < 0 || gy >= ROWS) return false;
        if (anyOcc(gx, gy, 1)) return false;
        for (var i = 0; i < trees.length; i++) { if (Math.floor(trees[i].x / GS) === gx && Math.floor(trees[i].y / GS) === gy) return false; }
        var type = Math.floor(Math.random() * TREE_TYPES.length);
        trees.push({ gx: gx, gy: gy, x: gx * GS + GS / 2 + (Math.random() - 0.5) * GS * 0.6, y: gy * GS + GS / 2 + (Math.random() - 0.5) * GS * 0.6, size: 0.55 + Math.random() * 0.5, phase: Math.random() * Math.PI * 2, sway: 0.5 + Math.random() * 0.5, type: type, hp: 3, chopPhase: 0, choppedBy: null, age: 0, growDur: 2 + Math.random() * 2 });
        return true;
      }
      function generateTrees() {
        trees = []; var target = TREE_INITIAL, attempts = 0;
        while (trees.length < target && attempts < 8000) {
          attempts++;
          var gx = Math.floor(Math.random() * COLS), gy = Math.floor(Math.random() * ROWS);
          var dCenter = Math.sqrt(Math.pow(gx - COLS / 2, 2) + Math.pow(gy - ROWS / 2, 2)); if (dCenter < 3) continue;
          if (anyOcc(gx, gy, 1)) continue;
          var blocked = false; for (var i = 0; i < trees.length; i++) { if (Math.floor(trees[i].x / GS) === gx && Math.floor(trees[i].y / GS) === gy) { blocked = true; break; } }
          if (blocked) continue;
          var type = Math.floor(Math.random() * TREE_TYPES.length);
          trees.push({ gx: gx, gy: gy, x: gx * GS + GS / 2 + (Math.random() - 0.5) * GS * 0.6, y: gy * GS + GS / 2 + (Math.random() - 0.5) * GS * 0.6, size: 0.75 + Math.random() * 0.6, phase: Math.random() * Math.PI * 2, sway: 0.5 + Math.random() * 0.5, type: type, hp: 3, chopPhase: 0, choppedBy: null, age: 99, growDur: 0 });
        }
      }
      function growOneTree() { if (trees.length >= TREE_MAX) return false; for (var a = 0; a < 30; a++) { var gx = Math.floor(Math.random() * COLS), gy = Math.floor(Math.random() * ROWS); if (makeTreeAt(gx, gy)) return true; } return false; }
      function currentGrowRate() { return Math.min(TREE_GROW_BASE + gameTime * TREE_GROW_PER_SEC, TREE_GROW_MAX); }
      function updateForest(dt) {
        gameTime += dt;
        for (var i = 0; i < trees.length; i++) { if (trees[i].age < trees[i].growDur) trees[i].age += dt; }
        var rate = currentGrowRate(); treeGrowTimer += rate * dt;
        while (treeGrowTimer >= 1) { treeGrowTimer -= 1; growOneTree(); }
        if (trees.length < TREE_MIN) { var toGrow = Math.min(TREE_MIN - trees.length, 3); for (var k = 0; k < toGrow; k++) growOneTree(); }
      }
      function updateForestHUD() {
        var elCount = document.getElementById('treeCount'), elMax = document.getElementById('treeMax'), badge = document.getElementById('forestBadge');
        if (!elCount) return; elCount.textContent = trees.length; elMax.textContent = TREE_MAX;
        if (currentGrowRate() > TREE_GROW_BASE + 0.2) badge.classList.add('growing'); else badge.classList.remove('growing');
      }

      // ============ ЖИТЕЛИ ============
      function spawnCitizen(homeId, gx, gy, role) {
        role = role || 'wander';
        if (citizens.length >= MAX_CITIZENS) {
          if (role === 'lumberjack') { var wi = -1; for (var i = 0; i < citizens.length; i++) if (citizens[i].role === 'wander') { wi = i; break; } if (wi >= 0) citizens.splice(wi, 1); else return null; } else return null;
        }
        var c = { x: gx * GS + GS / 2 + (Math.random() - 0.5) * GS * 0.5, y: gy * GS + GS / 2 + (Math.random() - 0.5) * GS * 0.5, tx: gx * GS + GS / 2, ty: gy * GS + GS / 2, speed: 90 + Math.random() * 40, skin: CITIZEN_COLORS[(Math.random() * CITIZEN_COLORS.length) | 0], shirt: CITIZEN_SHIRTS[(Math.random() * CITIZEN_SHIRTS.length) | 0], phase: Math.random() * Math.PI * 2, homeId: homeId, dir: 1, pauseTimer: 0, role: role, targetTree: null, choppingTimer: 0, carrying: false, stuckTimer: 0, lastX: 0, lastY: 0, retargetTimer: 0 };
        if (c.role === 'lumberjack') { c.lastX = c.x; c.lastY = c.y; findNearestTree(c); } else pickWanderTarget(c);
        citizens.push(c); return c;
      }
      function findNearestTree(c) {
        if (trees.length === 0) { c.targetTree = null; c.tx = c.x; c.ty = c.y; return false; }
        var best = null, bestD = Infinity;
        for (var i = 0; i < trees.length; i++) { var t = trees[i]; if (t.hp <= 0) continue; var dx = t.x - c.x, dy = t.y - c.y, d = dx * dx + dy * dy; if (d < bestD) { bestD = d; best = t; } }
        if (best) { c.targetTree = best; c.tx = best.x; c.ty = best.y; c.choppingTimer = 0; return true; }
        c.targetTree = null; return false;
      }
      function pickWanderTarget(c) {
        c.tx = GS * 1.5 + Math.random() * (COLS * GS - GS * 3); c.ty = GS * 1.5 + Math.random() * (ROWS * GS - GS * 3);
        c.targetTree = null; c.pauseTimer = 0.4 + Math.random() * 1.4; c.lastX = c.x; c.lastY = c.y; c.stuckTimer = 0;
      }
      function updateCitizens(dt) {
        if (dt > 0.2) dt = 0.2;
        for (var i = 0; i < citizens.length; i++) {
          var c = citizens[i];
          if (c.choppingTimer > 0) {
            c.choppingTimer -= dt; c.phase += dt * 22;
            if (c.targetTree) c.targetTree.chopPhase += dt * 15;
            if (c.choppingTimer <= 0) {
              if (c.targetTree && c.targetTree.hp > 0) { c.targetTree.hp--; state.wood += WOOD_PER_CHOP; c.carrying = true; sfxChop(); if (c.targetTree.hp <= 0) { var idx = trees.indexOf(c.targetTree); if (idx >= 0) trees.splice(idx, 1); c.targetTree = null; c.carrying = false; } }
              c.choppingTimer = 0;
              if (c.role === 'lumberjack') { if (!findNearestTree(c)) { pickWanderTarget(c); c.pauseTimer = 2 + Math.random() * 3; } }
            }
            continue;
          }
          if (c.pauseTimer > 0) { c.pauseTimer -= dt; c.phase += dt * 1.5; if (c.pauseTimer < 0) c.pauseTimer = 0; continue; }
          if (c.role === 'lumberjack') {
            if (!c.targetTree || c.targetTree.hp <= 0) { c.retargetTimer += dt; if (c.retargetTimer >= 0.4) { c.retargetTimer = 0; if (!findNearestTree(c)) { pickWanderTarget(c); c.pauseTimer = 2 + Math.random() * 3; } } } else { c.retargetTimer = 0; c.tx = c.targetTree.x; c.ty = c.targetTree.y; }
          }
          var dx = c.tx - c.x, dy = c.ty - c.y, d = Math.sqrt(dx * dx + dy * dy);
          if (d < ARRIVE_DIST) { if (c.role === 'lumberjack' && c.targetTree && c.targetTree.hp > 0) { c.choppingTimer = CHOP_DURATION; c.targetTree.choppedBy = c; } else pickWanderTarget(c); continue; }
          var step = Math.min(c.speed * dt, d); c.x += (dx / d) * step; c.y += (dy / d) * step;
          if (dx !== 0) c.dir = dx >= 0 ? 1 : -1;
          c.phase += dt * 9;
          c.stuckTimer += dt;
          if (c.stuckTimer > 1.5) { var moved = Math.abs(c.x - c.lastX) + Math.abs(c.y - c.lastY); if (moved < 12) { if (c.role === 'lumberjack') { if (!findNearestTree(c)) pickWanderTarget(c); } else pickWanderTarget(c); } c.lastX = c.x; c.lastY = c.y; c.stuckTimer = 0; }
        }
      }

      // ============ БИТВА И ИНТЕРАКТИВ ============
      var battleState = { active: false, timer: 0, playerWin: false, units: [], enemyBuildings: [], playerBuildings: [], selectedUnits: [], phase: 'attack', log: '' };
      var isMatching = false, matchTimer = null, currentQueueRef = null;
      
      // Для выделения рамкой
      var boxSelect = { active: false, startX: 0, startY: 0, endX: 0, endY: 0 };

      function mulberry32(a) { return function() { var t = a += 0x6D2B79F5; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; } }

      function findOpponent(useBot) {
        if (isMatching) return;
        isMatching = true;
        document.getElementById('botBattleBtn').disabled = true;
        document.getElementById('realBattleBtn').disabled = true;
        addLog(useBot ? '🤖 Поиск бота...' : '🔎 Поиск реального игрока...');

        let myBuildings = state.buildings.map(b => ({ type: b.type, gx: b.gx, gy: b.gy }));
        
        if (useBot) {
          setTimeout(() => {
            isMatching = false;
            document.getElementById('botBattleBtn').disabled = false;
            document.getElementById('realBattleBtn').disabled = false;
            startBotMatch();
          }, 500);
          return;
        }

        let arenaPath = 'queue_arena_' + state.rankIndex;
        let myRef = ref(db, arenaPath + '/' + myPlayerId);
        set(myRef, { id: myPlayerId, army: state.army, buildings: myBuildings });
        onDisconnect(myRef).remove();

        currentQueueRef = ref(db, arenaPath);
        let timeLeft = 4;
        matchTimer = setInterval(() => {
            if (!isMatching) return;
            timeLeft--;
            if (timeLeft <= 0) {
                clearInterval(matchTimer); off(currentQueueRef); remove(myRef);
                isMatching = false;
                document.getElementById('botBattleBtn').disabled = false;
                document.getElementById('realBattleBtn').disabled = false;
                addLog('⏳ Время вышло. Атакует бот!');
                startBotMatch();
            }
        }, 1000);

        onValue(currentQueueRef, (snapshot) => {
          if (!isMatching) return;
          const players = snapshot.val(); if (!players) return;
          const oppKeys = Object.keys(players).filter(id => id !== myPlayerId);

          if (oppKeys.length > 0) {
            const oppId = oppKeys[0]; const oppData = players[oppId];
            if (myPlayerId < oppId) {
              isMatching = false; clearInterval(matchTimer); off(currentQueueRef);
              document.getElementById('botBattleBtn').disabled = false;
              document.getElementById('realBattleBtn').disabled = false;
              remove(myRef); remove(ref(db, arenaPath + '/' + oppId));
              addLog('⚔️ Найден реальный игрок!');
              startBattleAnimation({ enemyArmy: oppData.army, enemyBuildings: oppData.buildings || [], isBot: false });
            }
          }
        });
      }

      function startBotMatch() {
          let botArmy = 10 + state.rankIndex * 20 + Math.floor(Math.random() * 20);
          let allowed = RANKS[state.rankIndex].str;
          let botBuildings = [];
          let slots = [];
          for(let x = 5; x < COLS - 5; x += 4) for(let y = 5; y < ROWS - 5; y += 4) slots.push({x, y});
          slots.sort(() => Math.random() - 0.5);
          for (let i = 0; i < 6 + state.rankIndex * 3; i++) {
              botBuildings.push({ type: allowed[Math.floor(Math.random() * allowed.length)], gx: slots[i].x, gy: slots[i].y });
          }
          startBattleAnimation({ enemyArmy: botArmy, enemyBuildings: botBuildings, isBot: true });

        }

        let pCount = battleState.units.filter(u => u.side === 'player').length;

      function updateBattle(dt) {
        if (!battleState.active) return;
        battleState.timer -= dt;
        if (battleState.timer <= 0) { endBattle(false); return; }

        // AI юнитов
        battleState.units.forEach(u => {
            // Проверка цели-юнита
            if (u.targetUnit && (u.targetUnit.hp <= 0 || (!u.targetUnit.x && !u.targetUnit.gx))) {
                u.targetUnit = null;
            }

            let targetX, targetY, range = UNITS[u.type].range;
            
            if (u.targetUnit) {
                targetX = u.targetUnit.x !== undefined ? u.targetUnit.x : u.targetUnit.gx;
                targetY = u.targetUnit.y !== undefined ? u.targetUnit.y : u.targetUnit.gy;
            } else if (u.side === 'player' && u.selected && u.targetPos) {
                targetX = u.targetPos.x;
                targetY = u.targetPos.y;
            } else {
                // Поиск ближайшего врага
                let enemies = battleState.units.filter(e => e.side !== u.side && e.hp > 0);
                let targets = enemies.length > 0 ? enemies : battleState.enemyBuildings.filter(b => b.hp > 0);
                let closest = null, minD = Infinity;
                targets.forEach(t => {
                    let tx = t.x !== undefined ? t.x : t.gx;
                    let ty = t.y !== undefined ? t.y : t.gy;
                    let d = Math.hypot(tx - u.x, ty - u.y);
                    if (d < minD) { minD = d; closest = t; }
                });
                if (closest) {
                    u.targetUnit = closest;
                    targetX = closest.x !== undefined ? closest.x : closest.gx;
                    targetY = closest.y !== undefined ? closest.y : closest.gy;
                }
            }

            if (targetX !== undefined && targetY !== undefined) {
                let dist = Math.hypot(targetX - u.x, targetY - u.y);
                
                // Атака
                if (dist <= range && u.targetUnit) {
                    u.cd -= dt;
                    if (u.cd <= 0) {
                        u.cd = UNITS[u.type].cd;
                        u.targetUnit.hp -= UNITS[u.type].dmg;
                        sfxHit();
                        let sp = w2s(u.x * GS, u.y * GS);
                        spawnParticles(sp.x, sp.y, 5, u.side === 'player' ? '#3498db' : '#e74c3c', 50, 3, 0.5);
                        if (u.targetUnit.hp <= 0 && u.targetUnit.gx !== undefined) {
                            let bsp = w2s(u.targetUnit.gx * GS + GS/2, u.targetUnit.gy * GS + GS/2);
                            spawnParticles(bsp.x, bsp.y, 20, '#8b6b3f', 100, 4, 1);
                        }
                    }
                } 
                // Движение
                else if (dist > 0.1) {
                    let dx = targetX - u.x, dy = targetY - u.y;
                    let step = UNITS[u.type].speed * dt;
                    u.x += (dx/dist) * step;
                    u.y += (dy/dist) * step;
                }
            }
        });

        // Удаление мертвых юнитов
        battleState.units = battleState.units.filter(u => u.hp > 0);

        // Проверка победы
        let pAlive = battleState.units.filter(u => u.side === 'player').length;
        let eAlive = battleState.units.filter(u => u.side === 'enemy').length;
        let bAlive = battleState.enemyBuildings.filter(b => b.hp > 0).length;
        
        if (bAlive === 0 && eAlive === 0) { endBattle(true); return; }
        if (pAlive === 0) { endBattle(false); return; }

        updateBattleUI();
      }

      function endBattle(win) {
        battleState.active = false;
        document.body.classList.remove('in-battle');
        battleState.playerWin = win;
        
        let gr = 0, wr = 0, armyChange = 0;
        if (win) {
            sfxWin();
            let destroyed = battleState.enemyBuildings.filter(b => b.hp <= 0).length;
            gr = 30 + destroyed * 5;
            wr = 15 + destroyed * 3;
            armyChange = 5;
            state.wins++;
            addLog('✅ ПОБЕДА!');
        } else {
            sfxLose();
            gr = 5; wr = 5; armyChange = -5;
            addLog('❌ Поражение.');
        }
        
        state.gold += gr; state.wood += wr; state.army = Math.max(5, state.army + armyChange);
        checkRank(); save(); updateHUD();

        document.getElementById('mtitle').textContent = win ? '🏆 Победа!' : '💔 Поражение';
        document.getElementById('mcontent').innerHTML = `<div class="blog">
          <div class="stat"><span>Золото:</span> <span class="${win?'win':'lose'}">${gr > 0 ? '+'+gr : gr}💰</span></div>
          <div class="stat"><span>Дерево:</span> <span class="${win?'win':'lose'}">${wr > 0 ? '+'+wr : wr}🪵</span></div>
          <div class="stat"><span>Армия:</span> <span class="${armyChange>0?'win':'lose'}">${armyChange > 0 ? '+'+armyChange : armyChange}⚔️</span></div>
        </div>`;
        document.getElementById('modal').style.display = 'flex';
      }

      // ============ РЕНДЕР БОЯ ============
      function renderBattle() {
        var bgGrad = ctx.createLinearGradient(0, 0, 0, cv.height);
        bgGrad.addColorStop(0, '#1a2a3a'); bgGrad.addColorStop(1, '#0a1a0a');
        ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, cv.width, cv.height);

        let scale = Math.min(cv.width / (COLS * GS), cv.height / (ROWS * GS)) * 1.2;
        let offX = (cv.width - COLS * GS * scale) / 2;
        let offY = (cv.height - ROWS * GS * scale) / 2;

        // Земля
        ctx.fillStyle = '#2c1e16'; 
        ctx.fillRect(offX, offY, COLS * GS * scale, ROWS * GS * scale);
        ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1;
        for (let x = 0; x < COLS; x+=2) { ctx.beginPath(); ctx.moveTo(offX + x*GS*scale, offY); ctx.lineTo(offX + x*GS*scale, offY + ROWS*GS*scale); ctx.stroke(); }
        for (let y = 0; y < ROWS; y+=2) { ctx.beginPath(); ctx.moveTo(offX, offY + y*GS*scale); ctx.lineTo(offX + COLS*GS*scale, offY + y*GS*scale); ctx.stroke(); }

        // Постройки
        battleState.enemyBuildings.forEach(b => {
            let bx = offX + b.gx * GS * scale;
            let by = offY + b.gy * GS * scale;
            drawBattleBuilding(bx, by, b.type, scale, b.hp, b.maxHp);
        });

        // Юниты
        battleState.units.forEach(u => {
            let ux = offX + u.x * GS * scale;
            let uy = offY + u.y * GS * scale;
            let def = UNITS[u.type];
            
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath(); ctx.ellipse(ux, uy + 5, 6*scale, 3*scale, 0, 0, Math.PI*2); ctx.fill();

            // Выделение и приказы
            if (u.side === 'player' && u.selected) {
                ctx.strokeStyle = '#00ff66'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(ux, uy, 12*scale, 0, Math.PI*2); ctx.stroke();
                
                // Линии приказов
                if (u.targetUnit) {
                    let tx = offX + (u.targetUnit.x !== undefined ? u.targetUnit.x : u.targetUnit.gx) * GS * scale;
                    let ty = offY + (u.targetUnit.y !== undefined ? u.targetUnit.y : u.targetUnit.gy) * GS * scale;
                    ctx.strokeStyle = 'rgba(231, 76, 60, 0.6)'; ctx.setLineDash([5,5]);
                    ctx.beginPath(); ctx.moveTo(ux, uy); ctx.lineTo(tx, ty); ctx.stroke(); ctx.setLineDash([]);
                } else if (u.targetPos) {
                    let tx = offX + u.targetPos.x * GS * scale, ty = offY + u.targetPos.y * GS * scale;
                    ctx.strokeStyle = 'rgba(0,255,102,0.6)'; ctx.setLineDash([5,5]);
                    ctx.beginPath(); ctx.moveTo(ux, uy); ctx.lineTo(tx, ty); ctx.stroke(); ctx.setLineDash([]);
                }
            }

            // Моделька юнита
            ctx.shadowColor = u.side === 'player' ? '#3498db' : '#e74c3c'; ctx.shadowBlur = 10;
            ctx.fillStyle = def.color;
            ctx.beginPath(); ctx.arc(ux, uy, 6*scale, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = def.skin;
            ctx.beginPath(); ctx.arc(ux, uy - 4*scale, 3*scale, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;

            // HP бар
            let hpW = 14 * scale;
            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.fillRect(ux - hpW/2, uy - 14*scale, hpW, 3*scale);
            ctx.fillStyle = u.hp / u.maxHp > 0.5 ? '#27ae60' : u.hp / u.maxHp > 0.25 ? '#f39c12' : '#e74c3c';
            ctx.fillRect(ux - hpW/2, uy - 14*scale, hpW * (u.hp/u.maxHp), 3*scale);
        });

        // Отрисовка рамки выделения
        if (boxSelect.active) {
            let minX = Math.min(boxSelect.startX, boxSelect.endX);
            let minY = Math.min(boxSelect.startY, boxSelect.endY);
            let w = Math.abs(boxSelect.endX - boxSelect.startX);
            let h = Math.abs(boxSelect.endY - boxSelect.startY);
            ctx.fillStyle = 'rgba(0, 255, 102, 0.2)';
            ctx.fillRect(minX, minY, w, h);
            ctx.strokeStyle = '#00ff66';
            ctx.lineWidth = 1;
            ctx.strokeRect(minX, minY, w, h);
        }

        drawParticles();
      }

      function drawBattleBuilding(x, y, type, scale, hp, maxHp) {
          let def = S[type]; if(!def) return;
          let sz = GS * def.size * scale * 0.8;
          let col = bcolor(type);
          
          ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(x + sz/2, y + sz*0.8, sz*0.6, sz*0.2, 0, 0, Math.PI*2); ctx.fill();
          
          ctx.fillStyle = col.l; ctx.fillRect(x, y + sz*0.2, sz, sz*0.6);
          ctx.fillStyle = col.d; ctx.fillRect(x + sz, y + sz*0.2, sz*0.2, sz*0.6);
          ctx.fillStyle = col.r; ctx.beginPath();
          ctx.moveTo(x, y + sz*0.2); ctx.lineTo(x + sz/2, y - sz*0.2); ctx.lineTo(x + sz, y + sz*0.2);
          ctx.lineTo(x + sz + sz*0.2, y + sz*0.1); ctx.lineTo(x + sz/2, y - sz*0.3); ctx.lineTo(x - sz*0.2, y + sz*0.1);
          ctx.closePath(); ctx.fill();

          ctx.font = (sz * 0.5) + 'px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.shadowColor = '#fff'; ctx.shadowBlur = 5;
          ctx.fillText(def.icon, x + sz/2, y + sz*0.5); 
          ctx.shadowBlur = 0;

          if (hp < maxHp) {
              ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(x, y - 10, sz, 4);
              ctx.fillStyle = hp / maxHp > 0.5 ? '#27ae60' : '#e74c3c'; ctx.fillRect(x, y - 10, sz * (hp/maxHp), 4);
          }
      }

      // ============ МОДЕЛИ (ПО ФОТО) ============
      function bcolor(t) {
        var c = {
          house:      { l: '#2e4d2e', d: '#1d331d', r: '#4a4a4a' }, // Зеленый дом
          farm:       { l: '#8b5a2b', d: '#5c3a1f', r: '#b22222' }, // Красный амбар
          lumberMill: { l: '#5c3a1f', d: '#3a2a1a', r: '#556b2f' }, // Сруб с мхом
          barracks:   { l: '#8b5a2b', d: '#5c3a1f', r: '#8b0000' }, // Деревянные стены, красная крыша
          blacksmith: { l: '#808080', d: '#505050', r: '#5c3a1f' }, // Каменная кузница
          wall:       { l: '#a9a9a9', d: '#696969', r: '#808080' },
          market:     { l: '#daa520', d: '#b8860b', r: '#e74c3c' }, // Рынок
          tower:      { l: '#b0b0b0', d: '#707070', r: '#4a4a4a' }, // Башня
          castle:     { l: '#d3d3d3', d: '#a9a9a9', r: '#1e90ff' }, // Замок с синими крышами
          dragonLair: { l: '#4a5d23', d: '#2b3614', r: '#4a0000' }  // Логово в корнях
        };
        return c[t] || { l: '#999', d: '#666', r: '#444' };
      }

      function drawVoxelBuilding(b) {
        var def = S[b.type]; if (!def) return;
        var size = def.size, p = w2s(b.gx * GS, b.gy * GS), ts = GS * size * cam.zoom;
        var col = bcolor(b.type);
        var hp = b.hp !== undefined ? b.hp : def.hp;
        var maxHp = def.hp;
        var dmgRatio = hp / maxHp;

        ctx.save();
        ctx.translate(p.x + ts / 2, p.y + ts / 2);
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath(); ctx.ellipse(0, ts * 0.35, ts * 0.45, ts * 0.2, 0, 0, Math.PI * 2); ctx.fill();

        var w = ts * 0.8, h = ts * 0.6, dp = ts * 0.2;

        if (b.type === 'house') {
          ctx.fillStyle = col.d; ctx.fillRect(-w/2, -h/2 - dp, w, h * 1.3);
          ctx.fillStyle = col.l; ctx.fillRect(-w/2, -h/2, w, h * 1.3);
          ctx.fillStyle = col.r;
          ctx.beginPath(); ctx.moveTo(-w/2 - dp, -h/2); ctx.lineTo(0, -h/2 - dp * 1.5); ctx.lineTo(w/2 + dp, -h/2); ctx.lineTo(w/2, -h/2 + dp); ctx.lineTo(-w/2, -h/2 + dp); ctx.fill();
          ctx.fillStyle = '#4a4a4a'; ctx.fillRect(w * 0.2, -h/2 - dp * 1.3, w * 0.15, dp * 0.9);
          ctx.fillStyle = '#ffffff'; ctx.fillRect(-w * 0.35, -h * 0.1, w * 0.25, h * 0.25);
          ctx.fillStyle = '#ffd966'; ctx.fillRect(-w * 0.33, -h * 0.08, w * 0.21, h * 0.21);
          ctx.fillStyle = '#ffffff'; ctx.fillRect(w * 0.1, -h * 0.1, w * 0.25, h * 0.25);
          ctx.fillStyle = '#ffd966'; ctx.fillRect(w * 0.12, -h * 0.08, w * 0.21, h * 0.21);
        } else if (b.type === 'farm') {
          ctx.fillStyle = col.l; ctx.fillRect(-w/2, -h/2, w, h);
          ctx.fillStyle = col.r;
          ctx.beginPath(); ctx.moveTo(-w/2 - dp, -h/2); ctx.lineTo(0, -h/2 - dp * 1.5); ctx.lineTo(w/2 + dp, -h/2); ctx.fill();
          ctx.fillStyle = '#3a1a00'; ctx.fillRect(-w * 0.25, -h * 0.1, w * 0.5, h * 0.6);
          ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(-w * 0.25, -h * 0.1); ctx.lineTo(w * 0.25, h * 0.5); ctx.moveTo(w * 0.25, -h * 0.1); ctx.lineTo(-w * 0.25, h * 0.5); ctx.stroke();
        } else if (b.type === 'lumberMill') {
          ctx.fillStyle = col.l; ctx.fillRect(-w/2, -h/2, w, h);
          ctx.strokeStyle = '#2a1a0a'; ctx.lineWidth = 1;
          for(let i=-h/2; i<h/2; i+=6) { ctx.beginPath(); ctx.moveTo(-w/2, i); ctx.lineTo(w/2, i); ctx.stroke(); }
          ctx.fillStyle = col.r;
          ctx.beginPath(); ctx.moveTo(-w/2, -h/2); ctx.lineTo(0, -h/2 - dp); ctx.lineTo(w/2, -h/2); ctx.fill();
          ctx.fillStyle = '#4a7a2e';
          for(let i=0; i<5; i++) { ctx.beginPath(); ctx.arc(-w/4 + i*w/8, -h/2 - dp/2, 3, 0, Math.PI*2); ctx.fill(); }
          ctx.fillStyle = '#8b6914'; ctx.fillRect(w*0.3, h*0.2, w*0.3, 4); ctx.fillRect(w*0.3, h*0.3, w*0.3, 4);
        } else if (b.type === 'barracks') {
          // Деревянные стены
          ctx.fillStyle = col.l; ctx.fillRect(-w/2, -h/2, w, h);
          ctx.strokeStyle = '#5c3a1f'; ctx.lineWidth = 1;
          for(let i=-h/2; i<h/2; i+=6) { ctx.beginPath(); ctx.moveTo(-w/2, i); ctx.lineTo(w/2, i); ctx.stroke(); }
          // Красная крыша
          ctx.fillStyle = col.r;
          ctx.beginPath(); ctx.moveTo(-w/2 - dp, -h/2); ctx.lineTo(0, -h/2 - dp * 1.5); ctx.lineTo(w/2 + dp, -h/2); ctx.fill();
          // Дверь
          ctx.fillStyle = '#3a1a00'; ctx.fillRect(-w*0.15, h*0.05, w*0.3, h*0.45);
          // Скрещенные мечи над дверью
          ctx.strokeStyle = '#ecf0f1'; ctx.lineWidth = 2;
          ctx.beginPath(); 
          ctx.moveTo(-w*0.12, h*0.1); ctx.lineTo(w*0.12, h*0.4); 
          ctx.moveTo(w*0.12, h*0.1); ctx.lineTo(-w*0.12, h*0.4); 
          ctx.stroke();
          // Флаг
          ctx.strokeStyle = '#5c3a1f'; ctx.beginPath(); ctx.moveTo(w*0.3, -h/2); ctx.lineTo(w*0.3, -h/2 - dp*2); ctx.stroke();
          ctx.fillStyle = '#e74c3c'; ctx.fillRect(w*0.3, -h/2 - dp*2, w*0.15, dp*0.8);
        } else if (b.type === 'blacksmith') {
          ctx.fillStyle = col.l; ctx.fillRect(-w/2, -h/2, w, h * 1.1);
          ctx.fillStyle = col.d; ctx.fillRect(-w/2, h * 0.2, w, h * 0.4);
          ctx.fillStyle = col.r;
          ctx.beginPath(); ctx.moveTo(-w/2 - dp, -h/2); ctx.lineTo(0, -h/2 - dp); ctx.lineTo(w/2 + dp, -h/2); ctx.fill();
          ctx.shadowColor = '#ff4500'; ctx.shadowBlur = 20;
          ctx.fillStyle = '#ff4500'; ctx.fillRect(-w * 0.2, 0, w * 0.2, h * 0.2);
          ctx.fillStyle = '#ffff00'; ctx.fillRect(-w * 0.15, 0.1*h, w * 0.1, h * 0.1);
          ctx.shadowBlur = 0;
        } else if (b.type === 'tower') {
          ctx.fillStyle = col.l; ctx.fillRect(-w*0.25, -h*1.5, w*0.5, h*1.7);
          for(let i=0; i<3; i++) ctx.fillRect(-w*0.25 + i*w*0.2, -h*1.5 - 6, w*0.1, 6);
          ctx.fillStyle = '#3a1a00'; ctx.beginPath(); ctx.arc(0, h*0.1, w*0.1, Math.PI, 0); ctx.fill(); ctx.fillRect(-w*0.1, h*0.1, w*0.2, h*0.2);
        } else if (b.type === 'market') {
          ctx.fillStyle = '#5c3a1f'; ctx.fillRect(-w/2, 0, w, h*0.5);
          for(let i=0; i<w; i+=8) { ctx.fillStyle = i%16===0 ? '#e74c3c' : '#ffffff'; ctx.fillRect(-w/2 + i, -h*0.4, 8, h*0.3); }
          ctx.fillStyle = '#f39c12'; ctx.beginPath(); ctx.arc(-w*0.2, 0, 3, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#27ae60'; ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.arc(w*0.2, 0, 3, 0, Math.PI*2); ctx.fill();
        } else if (b.type === 'castle') {
          ctx.fillStyle = col.l; ctx.fillRect(-w/2, -h*0.2, w, h*0.7);
          ctx.fillStyle = col.d; ctx.fillRect(-w/2, -h*0.8, w*0.25, h*1.3);
          ctx.fillRect(w/2 - w*0.25, -h*0.8, w*0.25, h*1.3);
          ctx.fillRect(-w*0.15, -h*1.2, w*0.3, h*1.7);
          ctx.fillStyle = col.r;
          ctx.beginPath(); ctx.moveTo(-w/2, -h*0.8); ctx.lineTo(-w/2+w*0.125, -h*1.2); ctx.lineTo(-w/2+w*0.25, -h*0.8); ctx.fill();
          ctx.beginPath(); ctx.moveTo(w/2-w*0.25, -h*0.8); ctx.lineTo(w/2-w*0.125, -h*1.2); ctx.lineTo(w/2, -h*0.8); ctx.fill();
          ctx.beginPath(); ctx.moveTo(-w*0.15, -h*1.2); ctx.lineTo(0, -h*1.6); ctx.lineTo(w*0.15, -h*1.2); ctx.fill();
          ctx.fillStyle = '#3a1a00'; ctx.beginPath(); ctx.arc(0, h*0.3, w*0.1, Math.PI, 0); ctx.fill(); ctx.fillRect(-w*0.1, h*0.3, w*0.2, h*0.2);
        } else if (b.type === 'dragonLair') {
          ctx.fillStyle = '#4a5d23'; ctx.beginPath(); ctx.arc(0, h*0.2, w*0.45, Math.PI, 0); ctx.fill();
          ctx.fillStyle = '#2b3614'; ctx.beginPath(); ctx.arc(0, h*0.2, w*0.3, Math.PI, 0); ctx.fill();
          ctx.fillStyle = '#3a1a00'; ctx.fillRect(-w*0.1, -h*0.1, w*0.2, h*0.4);
          ctx.shadowColor = '#ff4500'; ctx.shadowBlur = 15;
          ctx.fillStyle = '#ff4500'; ctx.fillRect(-w*0.05, 0, w*0.1, h*0.2);
          ctx.shadowBlur = 0;
        } else if (b.type === 'wall') {
          ctx.fillStyle = '#808080'; ctx.fillRect(-w/2, -h/4, w, h * 0.6);
          ctx.fillStyle = '#a9a9a9'; for (var i = -w/2; i < w/2; i += 12) { ctx.fillRect(i, -h/4 - 8, 7, 8); }
          ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(-w/2, 0); ctx.lineTo(w/2, 0); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(-w/4, -h/4); ctx.lineTo(-w/4, h*0.35); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(w/4, -h/4); ctx.lineTo(w/4, h*0.35); ctx.stroke();
        }

        if (cam.zoom > 0.4) {
          ctx.font = (ts * 0.22) + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillStyle = '#fff'; ctx.shadowColor = 'black'; ctx.shadowBlur = 4;
          ctx.fillText(def.icon, 0, -h * 0.85); ctx.shadowBlur = 0;
        }

        if (hp < maxHp) {
          var barW = ts * 0.7, barH = Math.max(4, 3 * cam.zoom);
          ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(-barW/2, -h * 1.3, barW, barH);
          ctx.fillStyle = dmgRatio > 0.5 ? '#27ae60' : dmgRatio > 0.25 ? '#f39c12' : '#e74c3c';
          ctx.fillRect(-barW/2, -h * 1.3, barW * dmgRatio, barH);
          ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1; ctx.strokeRect(-barW/2, -h * 1.3, barW, barH);
        }

        ctx.restore();
      }

      // ============ РЕНДЕР МИРА ============
      function drawVoxelTree(t) {
        var p = w2s(t.x, t.y), z = cam.zoom;
        if (p.x < -100 || p.x > cv.width + 100 || p.y < -150 || p.y > cv.height + 100) return;
        var grown = t.growDur > 0 ? Math.min(1, t.age / t.growDur) : 1;
        var sway = Math.sin(t.phase + performance.now() * 0.001 * t.sway) * 0.05;
        var sz = t.size * GS * z * 0.55 * (0.3 + 0.7 * grown);
        var def = TREE_TYPES[t.type];
        ctx.save(); ctx.globalAlpha = 0.4 + 0.6 * grown; ctx.translate(p.x, p.y);
        ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(sz * 0.2, sz * 0.2, sz * 0.5, sz * 0.2, 0, 0, Math.PI * 2); ctx.fill();
        if (t.chopPhase > 0) { t.chopPhase -= 0.5; ctx.translate(Math.sin(t.chopPhase * 30) * 3 * z, 0); }
        ctx.fillStyle = def.trunk; ctx.fillRect(-sz * 0.1, -sz * 0.4, sz * 0.2, sz * 0.5);
        ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(sz * 0.05, -sz * 0.4, sz * 0.05, sz * 0.5);
        ctx.rotate(sway); ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 10;
        ctx.fillStyle = def.color1; ctx.fillRect(-sz * 0.5, -sz * 0.8, sz * 1.0, sz * 0.6); ctx.fillRect(-sz * 0.3, -sz * 1.1, sz * 0.6, sz * 0.4);
        ctx.fillStyle = def.color2; ctx.fillRect(-sz * 0.4, -sz * 0.7, sz * 0.3, sz * 0.3); ctx.fillRect(-sz * 0.2, -sz * 1.0, sz * 0.3, sz * 0.2);
        ctx.restore();
      }

      function drawCitizen(c) {
        var p = w2s(c.x, c.y), z = cam.zoom;
        if (p.x < -60 || p.x > cv.width + 60 || p.y < -60 || p.y > cv.height + 60) return;
        var bob = Math.sin(c.phase) * 2 * z, legSwing = Math.sin(c.phase) * 3 * z, bodyH = 14 * z, headR = 4 * z;
        var baseY = p.y + bob, chopping = c.choppingTimer > 0, axeSwing = chopping ? Math.sin(c.phase * 3) * 0.9 : 0;
        ctx.save();

                    if (selected.length > 0) {
                        let enemyTarget = battleState.units.find(u => u.side === 'enemy' && Math.hypot(u.x * GS - tapW.x, u.y * GS - tapW.y) < 50);
                        if (!enemyTarget) {
                            enemyTarget = battleState.enemyBuildings.find(b => b.hp > 0 && tapW.x > b.gx * GS && tapW.x < (b.gx + S[b.type].size) * GS && tapW.y > b.gy * GS && tapW.y < (b.gy + S[b.type].size) * GS);
                        }
                        selected.forEach(u => {
                            if (enemyTarget) { u.targetUnit = enemyTarget; u.targetPos = null; }
                            else { u.targetUnit = null; u.targetPos = { x: tapW.x/GS, y: tapW.y/GS }; }
                        });
                    }
                }
            } else {
                var g = s2g(mouse.x, mouse.y); if (demolishMode) demolishBuilding(g.gx, g.gy); else if (placing) tryPlace(g.gx, g.gy);
            }
          }
          touchMode = null; touchHasMoved = false;
        } else if (ids.length === 1) { 
            var t0 = touches[ids[0]]; 
            touchMode = 'pan'; panStart.x = t0.x; panStart.y = t0.y; panStart.camX = cam.x; panStart.camY = cam.y; touchHasMoved = true; 
        }
      }, { passive: false });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') { if (placing) { placing = null; updateBanner(); renderShop(); } if (demolishMode) { demolishMode = false; updateBanner(); } }
        if (e.key === 'h' || e.key === 'H' || e.key === 'р' || e.key === 'Р') { setShopCollapsed(!shopCollapsed, true); }
      });

      // UI Кнопки
      document.getElementById('botBattleBtn').onclick = () => findOpponent(true);
      document.getElementById('realBattleBtn').onclick = () => findOpponent(false);
      document.getElementById('zi').onclick = function() { zoomAt(cv.width / 2, cv.height / 2, 1.25); };
      document.getElementById('zo').onclick = function() { zoomAt(cv.width / 2, cv.height / 2, 1 / 1.25); };
      document.getElementById('zr').onclick = function() { cam.x = COLS * GS / 2; cam.y = ROWS * GS / 2; cam.zoom = 0.7; updateHUD(); };
      document.getElementById('demolishBtn').onclick = function() { if (demolishMode) { demolishMode = false; addLog('🚫 Снос отменён'); } else { placing = null; demolishMode = true; addLog('🗑️ Режим сноса'); } updateBanner(); renderShop(); };
      
      document.getElementById('selectAllBtn').onclick = function() { battleState.units.forEach(u => u.selected = (u.side === 'player')); };
      document.getElementById('focusHQBtn').onclick = function() { 
          battleState.units.filter(u => u.side === 'player' && u.selected).forEach(u => { u.targetPos = { x: COLS/2, y: ROWS/2 }; u.targetUnit = null; }); 
      };
      document.getElementById('retreatBtn').onclick = function() { if (confirm('Отступить?')) endBattle(false); };

      document.getElementById('resetBtn').onclick = function() {
        if (!confirm('Удалить всё и начать заново?')) return;
        try { localStorage.removeItem('kr20'); } catch (e) {}
        state = { gold: 150, wood: 80, army: 10, wins: 0, rankIndex: 0, buildings: [], lastTick: Date.now() };
        citizens = []; placing = null; demolishMode = false; gameTime = 0; treeGrowTimer = 0; generateTrees();
        cam.x = COLS * GS / 2; cam.y = ROWS * GS / 2; cam.zoom = 0.7; updateBanner(); renderShop(); updateHUD();
        addLog('🔄 Игра сброшена. Лес снова растёт!');
      };

      function checkRank() {
        var r = curRank();
        if (r.maxWins !== Infinity && state.wins >= r.maxWins && state.rankIndex < RANKS.length - 1) { state.rankIndex++; addLog('🎉 Переход на Арену ' + (state.rankIndex + 1) + ': ' + RANKS[state.rankIndex].name); renderShop(); }
      }

      document.getElementById('mclose').onclick = function() { document.getElementById('modal').style.display = 'none'; };

      // ============ СТАРТ ============
      load(); generateTrees();
      for (var i = 0; i < state.buildings.length; i++) {
        var b = state.buildings[i], def = S[b.type];
        if (def && def.pop) { var existing = citizens.filter(function(c) { return c.homeId === b.id; }).length; for (var j = existing; j < def.pop * (b.level || 1); j++) { spawnCitizen(b.id, b.gx + (def.size - 1) / 2, b.gy + (def.size - 1) / 2, def.worker || 'wander'); } }
      }
      renderShop(); updateHUD();
      addLog('🏁 Игра загружена. Версия: ' + GAME_VERSION);
      
      setTimeout(function() { var h = document.getElementById('help'); if (h) h.classList.add('hidden'); }, 8000);
    })();
  </script>
</body>
</html>
