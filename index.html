<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;touch-action:none;z-index:1}
.ui-layer{position:fixed;inset:0;pointer-events:none;z-index:10}
.ui-layer *{pointer-events:auto}
.tabs{position:absolute;top:0;left:0;right:0;display:flex;justify-content:center;gap:4px;padding:8px;background:linear-gradient(180deg,rgba(10,14,26,.9),transparent)}
.tab{padding:8px 14px;border-radius:20px;border:1px solid #444;background:rgba(30,40,60,.8);color:#b8c4d8;font-weight:bold;font-size:.75rem;cursor:pointer;white-space:nowrap;transition:0.2s}
.tab.active{background:#3b8526;color:#fff;border-color:#5cbb3d;box-shadow:0 0 10px rgba(92,187,61,.5)}
.hud{position:absolute;top:55px;left:10px;right:10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.resources{display:flex;gap:6px;background:rgba(20,25,40,.9);padding:8px 12px;border-radius:12px;border:1px solid #555;flex-wrap:wrap;max-width:70%}
.res-item{color:#ddd;font-weight:bold;display:flex;align-items:center;gap:4px;font-size:.72rem}
.res-item span{background:#1a1a1a;padding:2px 8px;border-radius:6px;min-width:36px;text-align:center;border:1px solid #333;color:#fff}
.res-item small{color:#8fb36f;font-size:.55rem;font-weight:normal}
.th-badge{background:linear-gradient(135deg,#b8860b,#8b6508);padding:8px 16px;border-radius:12px;color:#fff;font-weight:bold;font-size:.72rem;border:1px solid #daa520;text-align:center;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.5)}
.th-badge small{display:block;font-size:.58rem;opacity:.9;font-weight:normal;margin-top:2px}
#shop-container{position:absolute;right:10px;top:150px;bottom:80px;width:170px;transition:transform 0.3s ease-in-out}
#shop-container.hidden{transform:translateX(190px)}
.shop{width:100%;height:100%;background:rgba(20,25,40,.95);border:1px solid #555;border-radius:12px;padding:10px;overflow-y:auto;box-shadow:0 4px 20px rgba(0,0,0,.5)}

.shop-item.selected{background:#3b8526;border-color:#5cbb3d}
.shop-item.locked{opacity:.4;cursor:not-allowed}
.shop-top{display:flex;align-items:center;gap:8px}
.shop-icon{font-size:1.2rem;width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:#111;border-radius:6px}
.shop-name{color:#fff;font-weight:bold;font-size:.7rem}
.shop-cost{color:#aaa;font-size:.58rem;margin-top:2px}
#toggleShopBtn{position:absolute;right:190px;top:160px;z-index:20;width:36px;height:36px;border-radius:50%;background:#3b8526;border:2px solid #5cbb3d;color:white;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.5);transition:right 0.3s ease-in-out}
.bar{position:absolute;bottom:15px;left:15px;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 30px);right:15px}
.bar-group{display:flex;gap:4px;padding:4px;background:rgba(20,25,40,.9);border-radius:12px;border:1px solid #555}
.btn{background:#2a2a2a;border:1px solid #555;color:#ddd;padding:8px 12px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:.7rem;transition:0.1s}
.btn:active{transform:scale(0.95)}
.btn:hover{background:#444}
.btn.primary{background:#3b8526;border-color:#5cbb3d;color:#fff}
#dpad{position:absolute;bottom:90px;left:20px;width:140px;height:140px;display:none;z-index:15;opacity:0.7}
#dpad button{position:absolute;width:44px;height:44px;background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.5);border-radius:50%;color:#fff;font-size:18px;font-weight:bold}
#dpad button:active{background:rgba(255,255,255,0.4)}
#dp-up{top:0;left:48px}#dp-down{bottom:0;left:48px}#dp-left{top:48px;left:0}#dp-right{top:48px;right:0}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.85);display:none;justify-content:center;align-items:center;z-index:1000;padding:20px;backdrop-filter:blur(5px)}
.modal-c{background:#1e2538;border:2px solid #5cbb3d;border-radius:16px;padding:20px;max-width:440px;width:100%;text-align:center;color:#ddd;max-height:90vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.8)}
.modal-c h3{font-size:1.05rem;color:#fff;margin-bottom:15px}
.modal-c h4{font-size:.85rem;color:#fbbf24;margin:12px 0 6px;text-align:left}
.blog{background:#111;border-radius:8px;padding:12px;font-size:.78rem;margin:10px 0;border:1px solid #333;text-align:left}
.blog .stat{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #333}
.blog .stat:last-child{border:none}
.mbtn{background:#3b8526;border:1px solid #5cbb3d;border-radius:8px;padding:10px 20px;font-weight:bold;color:#fff;cursor:pointer;margin:5px;font-size:.78rem;width:100%;max-width:220px}
.mbtn:active{transform:scale(0.95)}
.log{position:absolute;bottom:160px;left:10px;width:200px;max-height:80px;overflow-y:auto;z-index:9;background:rgba(0,0,0,.7);border-radius:8px;padding:5px 8px;font-family:monospace;font-size:.6rem;color:#888;pointer-events:none}
#toast{position:absolute;top:120px;left:50%;transform:translateX(-50%);background:rgba(30,40,60,.95);border:1px solid #5cbb3d;border-radius:10px;padding:8px 16px;color:#fff;font-size:.75rem;font-weight:bold;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.6)}
#toast.show{opacity:1}
.ideas-tabs{display:flex;gap:4px;margin-bottom:10px}
.ideas-tabs .btn{flex:1;font-size:.65rem;padding:6px 4px}
.ideas-tabs .btn.active{background:#3b8526;border-color:#5cbb3d}
.idea-card{background:#111;border:1px solid #333;border-radius:8px;padding:10px;margin-bottom:8px;text-align:left;font-size:.75rem}
.idea-card .meta{display:flex;justify-content:space-between;color:#888;font-size:.6rem;margin-top:6px}
.idea-card .tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.tag{background:#2a2a2a;color:#ccc;padding:2px 6px;border-radius:4px;font-size:.55rem;border:1px solid #444}
.tag.active{background:#3b8526;color:#fff;border-color:#5cbb3d}
.tag.planned{background:#444;color:#aaa;border-color:#666}
textarea{width:100%;background:#111;border:1px solid #444;border-radius:8px;padding:8px;color:#fff;font-size:.75rem;resize:vertical;min-height:60px;font-family:inherit}
textarea:focus{outline:none;border-color:#5cbb3d}
.filter-warn{background:#7f1d1d;border:1px solid #ef4444;border-radius:6px;padding:6px 8px;font-size:.65rem;color:#fca5a5;margin-top:6px;text-align:left}
.tech-tree{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.tech-item{background:#111;border:1px solid #444;border-radius:8px;padding:8px;text-align:left;font-size:.7rem}
.tech-item.max{border-color:#fbbf24;background:#1a1410}
.tech-item.locked{opacity:.5}
.tech-item button{margin-top:4px;padding:4px 8px;font-size:.6rem;width:100%}
.ach-item{background:#111;border:1px solid #333;border-radius:6px;padding:6px;margin-bottom:4px;font-size:.68rem;display:flex;justify-content:space-between;align-items:center}

.ai-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.ai-stat{background:#111;border:1px solid #444;border-radius:6px;padding:6px;text-align:center;font-size:.65rem}

.ai-person.active{background:#3b82f6;border-color:#60a5fa;color:#fff}

.th-badge{font-size:.6rem;padding:6px 10px}

function filterContent(text){
  let out = text, hits = [];
  const all = [...FILTER_WORDS.profanity,...FILTER_WORDS.profanityEn,...FILTER_WORDS.slurs,...FILTER_WORDS.politics];
  for (const w of all){
    if (!w || w.length < 2) continue;

}

// ===== ТЕРРЕЙН =====
function hash2(ix,iy,seed=0){
  let h = (ix*374761393 + iy*668265263 + seed*982451653) | 0;
  h = ((h ^ (h >>> 13)) * 1274126177) | 0;
  h = h ^ (h >>> 16);
  return (h & 0x7fffffff) / 0x7fffffff;
}
function smoothNoise(x,y,scale,seed=0){
  const ix = Math.floor(x/scale), iy = Math.floor(y/scale);
  const fx = x/scale-ix, fy = y/scale-iy;
  const sx = fx*fx*(3-2*fx), sy = fy*fy*(3-2*fy);
  const a = hash2(ix,iy,seed), b = hash2(ix+1,iy,seed);
  const c = hash2(ix,iy+1,seed), d = hash2(ix+1,iy+1,seed);
  return (a*(1-sx)+b*sx)*(1-sy)+(c*(1-sx)+d*sx)*sy;
}
function computeTerrain(gx,gy){
  const wx = gx*GS, wy = gy*GS;
  const dist = Math.hypot(wx,wy);
  if (dist > 3000) return 'water';
  if (dist < 600) return 'grass';
  const sea = smoothNoise(gx,gy,20,1);
  if (sea > 0.75) return 'water';
  const river = smoothNoise(gx,gy,12,3);
  if (Math.abs(river-0.5) < 0.05) return 'river';
  return 'grass';
}
const terrainCache = new Map();
function getTerrain(gx,gy){
  const key = gx+','+gy;
  if (terrainCache.has(key)) return terrainCache.get(key);
  const t = computeTerrain(gx,gy);
  terrainCache.set(key,t);
  if (terrainCache.size > 5000){
    const ks = [...terrainCache.keys()];
    for (let i=0;i<ks.length/2;i++) terrainCache.delete(ks[i]);
  }
  return t;
}

function treeHash(gx,gy){
  const s = Math.sin(gx*12.9898 + gy*78.233) * 43758.5453;
  return s - Math.floor(s);
}
function hasTreeAt(gx,gy){
  if (findBuilding(gx,gy)) return false;
  if (state.choppedTrees && state.choppedTrees[gx+'_'+gy]) return false;
  if (getTerrain(gx,gy) !== 'grass') return false;
  return treeHash(gx,gy) <= 0.10;
}
function drawTree(gx,gy){
  const cx0 = gx*GS+GS/2, cy0 = gy*GS+GS/2;
  const p = w2s(cx0,cy0);
  const s = GS*cam.zoom;
  const size = 0.65 + treeHash(gx+7,gy+13)*0.75;
  const hue = treeHash(gx+91,gy+37);
  const cx = p.x, cy = p.y;
  ctx.fillStyle='rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.ellipse(cx,cy+s*0.12,s*0.28*size,s*0.11*size,0,0,Math.PI*2); ctx.fill();
  const trunkW = s*0.07*size, trunkH = s*0.45*size;
  ctx.fillStyle='#5a3a1f';
  ctx.fillRect(cx-trunkW/2, cy-trunkH, trunkW, trunkH);
  ctx.fillStyle='#7a5028';
  ctx.fillRect(cx-trunkW/2, cy-trunkH, trunkW*0.4, trunkH);
  const cY = cy-trunkH-s*0.14*size, cR = s*0.24*size;
  ctx.fillStyle = hue<0.33?'#1f4a15':hue<0.66?'#2d5a1f':'#1a5c25';
  ctx.beginPath(); ctx.arc(cx,cY,cR,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = hue<0.33?'#2d5a1f':hue<0.66?'#3b7a28':'#2a7a30';
  ctx.beginPath(); ctx.arc(cx-cR*0.45,cY-cR*0.3,cR*0.72,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+cR*0.45,cY-cR*0.25,cR*0.72,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = hue<0.33?'#3b7a28':hue<0.66?'#4a8f33':'#388a3e';
  ctx.beginPath(); ctx.arc(cx,cY-cR*0.55,cR*0.62,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(180,230,140,0.25)';
  ctx.beginPath(); ctx.arc(cx-cR*0.3,cY-cR*0.6,cR*0.25,0,Math.PI*2); ctx.fill();
}
function findTreeAt(sx,sy){
  const w = s2w(sx,sy);
  const gx = Math.floor(w.x/GS), gy = Math.floor(w.y/GS);
  for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++){
    if (hasTreeAt(gx+dx,gy+dy)) return {gx:gx+dx, gy:gy+dy};
  }
  return null;
}
function chopTree(gx,gy){
  if (!hasTreeAt(gx,gy)) return;
  if (!state.choppedTrees) state.choppedTrees = {};
  state.choppedTrees[gx+'_'+gy] = true;
  state.wood += 5;
  addLog('🪓 +5 дерева');
  toast('🪓 +5🪵');
  save(); updateHUD(); checkAchievements();
}

let ships = [];
function updateShips(dt){
  ships = ships.filter(s => Math.hypot(s.x-player.x, s.y-player.y) < 2500);
  if (ships.length < 4){
    for (let attempt=0; attempt<25; attempt++){
      const angle = Math.random()*Math.PI*2;
      const dist = 300 + Math.random()*700;
      const wx = player.x + Math.cos(angle)*dist;
      const wy = player.y + Math.sin(angle)*dist;
      const gx = Math.floor(wx/GS), gy = Math.floor(wy/GS);
      if (getTerrain(gx,gy) === 'water'){
        ships.push({x:wx, y:wy, targetX:wx, targetY:wy, speed:30+Math.random()*20, angle:Math.random()*Math.PI*2, lastClick:0});
        break;
      }
    }
  }
  ships.forEach(s => {
    const dx = s.targetX-s.x, dy = s.targetY-s.y;
    const d = Math.hypot(dx,dy);
    if (d < 15){
      for (let attempt=0; attempt<15; attempt++){
        const angle = Math.random()*Math.PI*2;
        const dist = 100+Math.random()*300;
        const tx = s.x + Math.cos(angle)*dist;
        const ty = s.y + Math.sin(angle)*dist;
        if (getTerrain(Math.floor(tx/GS), Math.floor(ty/GS)) === 'water'){
          s.targetX = tx; s.targetY = ty; break;
        }
      }
    } else {
      s.x += dx/d * s.speed * dt;
      s.y += dy/d * s.speed * dt;
      s.angle = Math.atan2(dy,dx);
    }
  });
}
function drawShip(s){
  const p = w2s(s.x,s.y), z = cam.zoom, size = 22*z;
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(p.x,p.y+size*0.3,size*0.7,size*0.25,0,0,Math.PI*2); ctx.fill();
  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.rotate(s.angle + Math.PI/2);
  ctx.fillStyle='#5c3a1f';
  ctx.beginPath();
  ctx.moveTo(0,-size*0.8);
  ctx.quadraticCurveTo(size*0.4,size*0.2,size*0.35,size*0.5);
  ctx.lineTo(-size*0.35,size*0.5);
  ctx.quadraticCurveTo(-size*0.4,size*0.2,0,-size*0.8);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='#8b6f47';
  ctx.beginPath();
  ctx.moveTo(0,-size*0.7);
  ctx.quadraticCurveTo(size*0.25,size*0.2,size*0.2,size*0.4);
  ctx.lineTo(-size*0.2,size*0.4);
  ctx.quadraticCurveTo(-size*0.25,size*0.2,0,-size*0.7);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#3a2410';
  ctx.lineWidth = Math.max(2, size*0.08);
  ctx.beginPath(); ctx.moveTo(0,size*0.2); ctx.lineTo(0,-size*0.6); ctx.stroke();
  ctx.fillStyle='#f5e6d3';
  ctx.beginPath(); ctx.moveTo(0,-size*0.55); ctx.lineTo(size*0.3,-size*0.1); ctx.lineTo(0,size*0.1); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#c9b899'; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle='#d94b3b';
  ctx.beginPath(); ctx.moveTo(0,-size*0.6); ctx.lineTo(size*0.2,-size*0.5); ctx.lineTo(0,-size*0.4); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function findShipAt(sx,sy){
  const w = s2w(sx,sy);
  for (let s of ships){
    if (Math.hypot(w.x-s.x, w.y-s.y) < 30) return s;
  }
  return null;
}

const cam = {x:player.x, y:player.y, zoom:1, targetX:player.x, targetY:player.y};
function w2s(wx,wy){ return {x:(wx-cam.x)*cam.zoom + innerWidth/2, y:(wy-cam.y)*cam.zoom + innerHeight/2}; }
function s2w(sx,sy){ return {x:(sx-innerWidth/2)/cam.zoom + cam.x, y:(sy-innerHeight/2)/cam.zoom + cam.y}; }
function s2g(sx,sy){ const w = s2w(sx,sy); return {gx:Math.floor(w.x/GS), gy:Math.floor(w.y/GS)}; }

function shade(hex,p){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const amt = Math.round(2.55*p);
  const c = v => Math.max(0,Math.min(255,v+amt)).toString(16).padStart(2,'0');
  return '#'+c(r)+c(g)+c(b);
}
function drawIsoBuilding(b){
  const def = S[b.type]; if(!def) return;
  const p = w2s(b.gx*GS, b.gy*GS);
  const ts = GS*def.size*cam.zoom;
  const cx = p.x+ts/2, cy = p.y+ts/2;
  const w = ts*0.4, h = ts*0.2, wallH = ts*0.4, roofH = ts*0.5;
  const pTopW={x:cx,y:cy-h-wallH}, pRightW={x:cx+w,y:cy-wallH}, pBottomW={x:cx,y:cy+h-wallH}, pLeftW={x:cx-w,y:cy-wallH};
  const rTop={x:cx,y:cy-h-wallH-roofH}, rBottom={x:cx,y:cy+h-wallH-roofH};
  const pLeft={x:cx-w,y:cy}, pRight={x:cx+w,y:cy}, pBottom={x:cx,y:cy+h};
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(cx,cy+h*1.2,w*1.2,h*1.2,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=def.wall;
  ctx.beginPath(); ctx.moveTo(pLeft.x,pLeft.y); ctx.lineTo(pBottom.x,pBottom.y); ctx.lineTo(pBottomW.x,pBottomW.y); ctx.lineTo(pLeftW.x,pLeftW.y); ctx.closePath(); ctx.fill();
  ctx.fillStyle=shade(def.wall,-25);
  ctx.beginPath(); ctx.moveTo(pBottom.x,pBottom.y); ctx.lineTo(pRight.x,pRight.y); ctx.lineTo(pRightW.x,pRightW.y); ctx.lineTo(pBottomW.x,pBottomW.y); ctx.closePath(); ctx.fill();
  if (b.type==='house'){
    ctx.fillStyle='#5c3a1f'; ctx.fillRect(pLeft.x+w*0.3,pLeft.y+h*0.3-wallH*0.7,w*0.2,wallH*0.7);
  } else if (b.type==='townHall'){
    ctx.fillStyle='#fbbf24'; ctx.fillRect(rTop.x-2,rTop.y-30,4,30);
    ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.moveTo(rTop.x+2,rTop.y-30); ctx.lineTo(rTop.x+20,rTop.y-20); ctx.lineTo(rTop.x+2,rTop.y-10); ctx.fill();
  } else if (b.type==='farm'){
    ctx.save(); ctx.translate(pRightW.x-10,pRightW.y+10); ctx.rotate(Date.now()/1000);
    ctx.strokeStyle='#ddd'; ctx.lineWidth=3;
    for(let i=0;i<4;i++){ ctx.rotate(Math.PI/2); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-wallH*0.8); ctx.stroke(); }
    ctx.restore();
  }
  ctx.fillStyle=def.roof;
  ctx.beginPath(); ctx.moveTo(pLeftW.x,pLeftW.y); ctx.lineTo(pTopW.x,pTopW.y); ctx.lineTo(rTop.x,rTop.y); ctx.lineTo(rBottom.x,rBottom.y); ctx.lineTo(pBottomW.x,pBottomW.y); ctx.closePath(); ctx.fill();
  ctx.fillStyle=shade(def.roof,-20);
  ctx.beginPath(); ctx.moveTo(pRightW.x,pRightW.y); ctx.lineTo(pTopW.x,pTopW.y); ctx.lineTo(rTop.x,rTop.y); ctx.lineTo(rBottom.x,rBottom.y); ctx.lineTo(pBottomW.x,pBottomW.y); ctx.closePath(); ctx.fill();
  ctx.fillStyle=def.wall;
  ctx.beginPath(); ctx.moveTo(pLeftW.x,pLeftW.y); ctx.lineTo(pRightW.x,pRightW.y); ctx.lineTo(rBottom.x,rBottom.y); ctx.closePath(); ctx.fill();
  const fs = Math.max(12, ts*0.2);
  ctx.font = fs+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#fff'; ctx.strokeStyle='#000'; ctx.lineWidth=3;
  ctx.strokeText(def.icon,cx,cy-wallH-roofH-15); ctx.fillText(def.icon,cx,cy-wallH-roofH-15);
  if (b.level>1){
    ctx.font='bold '+(fs*0.4)+'px sans-serif'; ctx.fillStyle='#fbbf24';
    ctx.strokeText('★'+b.level,cx,cy+wallH*0.6); ctx.fillText('★'+b.level,cx,cy+wallH*0.6);
  }
  ctx.restore();
}
function drawHuman(x,y,isPlayer){
  const p = w2s(x,y), z = cam.zoom, s = 14*z;
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(p.x,p.y,s*0.6,s*0.2,0,0,Math.PI*2); ctx.fill();
  if (isPlayer){
    ctx.strokeStyle='rgba(92,187,61,0.3)'; ctx.lineWidth=2; ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.arc(p.x,p.y,MAX_BUILD_DIST*z,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
  }
  const skin='#fcd3b0', shirt=isPlayer?'#3b8526':'#4a7ab5', pants='#3b3b3b';
  const walk = Math.sin(Date.now()/100 + (isPlayer?0:x))*3;
  ctx.fillStyle=pants; const legW=s*0.2,legH=s*0.4;
  ctx.fillRect(p.x-s*0.25,p.y-legH,legW,legH+walk);
  ctx.fillRect(p.x+s*0.05,p.y-legH,legW,legH-walk);
  ctx.fillStyle=shirt; const bodyH=s*0.5;
  ctx.fillRect(p.x-s*0.3,p.y-legH-bodyH,s*0.6,bodyH);
  ctx.fillStyle=skin;
  ctx.fillRect(p.x-s*0.45,p.y-legH-bodyH+s*0.1,s*0.15,bodyH*0.8);
  ctx.fillRect(p.x+s*0.3,p.y-legH-bodyH+s*0.1,s*0.15,bodyH*0.8);
  ctx.fillStyle=skin; ctx.beginPath(); ctx.arc(p.x,p.y-legH-bodyH-s*0.25,s*0.25,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#222'; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle='#000';
  ctx.fillRect(p.x-s*0.1,p.y-legH-bodyH-s*0.3,2,2);
  ctx.fillRect(p.x+s*0.05,p.y-legH-bodyH-s*0.3,2,2);
  if (isPlayer){
    ctx.font='bold 12px sans-serif'; ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.strokeStyle='#000'; ctx.lineWidth=3;
    ctx.strokeText('Вы',p.x,p.y-legH-bodyH-s*0.7); ctx.fillText('Вы',p.x,p.y-legH-bodyH-s*0.7);
  }
}
function drawGround(){
  const tl = s2w(0,0), br = s2w(innerWidth,innerHeight);
  const minX = Math.floor(tl.x/GS)-1, maxX = Math.ceil(br.x/GS)+1;
  const minY = Math.floor(tl.y/GS)-1, maxY = Math.ceil(br.y/GS)+1;
  const cs = GS*cam.zoom;
  const now = Date.now();
  ctx.fillStyle='#1a2f1a'; ctx.fillRect(0,0,innerWidth,innerHeight);
  for (let gy=minY; gy<=maxY; gy++){
    for (let gx=minX; gx<=maxX; gx++){
      const p = w2s(gx*GS, gy*GS);
      const terrain = getTerrain(gx,gy);
      if (terrain === 'water'){
        ctx.fillStyle='#1a3d5c';
        ctx.fillRect(p.x,p.y,cs+1,cs+1);
        const wave1 = Math.sin(now/500 + gx*0.7 + gy*0.4)*cs*0.08;
        const wave2 = Math.cos(now/600 + gx*0.5 + gy*0.8)*cs*0.06;
        ctx.fillStyle='rgba(100,150,200,0.35)';
        ctx.fillRect(p.x+cs*0.15, p.y+cs*0.3+wave1, cs*0.4, Math.max(1,cs*0.06));
        ctx.fillStyle='rgba(140,190,230,0.25)';
        ctx.fillRect(p.x+cs*0.5, p.y+cs*0.6+wave2, cs*0.35, Math.max(1,cs*0.05));
        ctx.fillStyle='rgba(220,240,255,0.15)';
        ctx.fillRect(p.x+cs*0.25, p.y+cs*0.5+wave1*0.5, cs*0.2, Math.max(1,cs*0.04));
      } else if (terrain === 'river'){
        ctx.fillStyle='#2d6aa0';
        ctx.fillRect(p.x,p.y,cs+1,cs+1);
        const flow = Math.sin(now/400 + gx*0.5 + gy*0.9)*cs*0.05;
        ctx.fillStyle='rgba(160,210,245,0.3)';
        ctx.fillRect(p.x+cs*0.2, p.y+cs*0.45+flow, cs*0.6, Math.max(1,cs*0.05));
      } else {
        const seed = ((gx*73856093)^(gy*19349663))&0xFFFF;
        const pal = [[85,140,55],[75,125,45],[95,155,65]][seed%3];
        ctx.fillStyle = `rgb(${pal[0]},${pal[1]},${pal[2]})`;
        ctx.fillRect(p.x,p.y,cs+1,cs+1);
      }
    }
  }
  const dt = state.dayTime;
  let tint = 0;
  if (dt<0.25 || dt>0.75) tint=0.45;
  else if (dt<0.35 || dt>0.65) tint=0.25;
  if (tint>0){
    ctx.fillStyle=`rgba(10,10,40,${tint})`;
    ctx.fillRect(0,0,innerWidth,innerHeight);
  }
  if (state.weather==='rain'){
    ctx.strokeStyle='rgba(150,180,220,0.5)'; ctx.lineWidth=2;
    for (let i=0;i<40;i++){
      const x = Math.random()*innerWidth, y = Math.random()*innerHeight;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-3,y+15); ctx.stroke();
    }
  } else if (state.weather==='snow'){
    ctx.fillStyle='rgba(255,255,255,0.7)';
    for (let i=0;i<30;i++){
      ctx.beginPath(); ctx.arc(Math.random()*innerWidth, Math.random()*innerHeight, 2, 0, Math.PI*2); ctx.fill();
    }
  }
}

function closeModals(){ ['genericModal','upgradeModal','ideasModal','aiModal','techModal','settingsModal'].forEach(id=>document.getElementById(id).style.display='none'); }
function addLog(msg){ const l = document.getElementById('log'); const d = document.createElement('div'); d.textContent = msg; l.appendChild(d); while(l.children.length>10) l.removeChild(l.firstChild); l.scrollTop = l.scrollHeight; }
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function save(){ try{ state.playerX=Math.floor(player.x); state.playerY=Math.floor(player.y); storage.set('kr_v13_state', JSON.stringify(state)); } catch(e){} }

function updateHUD(){
  document.getElementById('gold').textContent = Math.floor(state.gold);
  document.getElementById('wood').textContent = Math.floor(state.wood);
  document.getElementById('stone').textContent = Math.floor(state.stone);
  document.getElementById('food').textContent = Math.floor(state.food);
  document.getElementById('pop').textContent = totalPopulation();
  document.getElementById('army').textContent = totalArmy();
  const g = goldRate(), w = woodRate(), st = stoneRate();
  document.getElementById('goldRate').textContent = g>0?`+${g.toFixed(1)}/с`:'';
  document.getElementById('woodRate').textContent = w>0?`+${w.toFixed(1)}/с`:'';
  document.getElementById('stoneRate').textContent = st>0?`+${st.toFixed(1)}/с`:'';
  document.getElementById('thLevel').textContent = state.townHallLevel || '?';
  document.getElementById('thInfo').textContent = `Эра ${state.era} · Реп. ${state.reputation} · 🤖 ${state.ai.mode==='off'?'выкл':state.ai.mode==='assist'?'советник':'авто'}`;
}

function findBuilding(gx,gy){
  for (let c of chunks.values()) for (let b of c.buildings){
    const sz = (S[b.type]||{size:1}).size;
    if (gx>=b.gx && gx<b.gx+sz && gy>=b.gy && gy<b.gy+sz) return {b, chunk:c};
  }
  return null;
}

let placing = null;
function renderShop(){
  const list = document.getElementById('shopList'); list.innerHTML = '';
  Object.keys(S).forEach(type=>{
    if (type === 'townHall') return;
    const def = S[type];
    const locked = (type==='university' && state.townHallLevel<2) || (type==='temple' && state.townHallLevel<2);
    const item = document.createElement('div');
    item.className = 'shop-item'+(placing===type?' selected':'')+(locked?' locked':'');
    item.innerHTML = `<div class="shop-top"><div class="shop-icon">${def.icon}</div><div><div class="shop-name">${def.name}</div><div class="shop-cost">${def.cost.g}🪙 ${def.cost.w}🪵</div></div></div>`;
    if (!locked) item.onclick = ()=>{ placing = placing===type?null:type; renderShop(); };
    list.appendChild(item);
  });
}

function tryPlace(gx,gy){
  if (!placing) return;
  const def = S[placing];
  if (Math.hypot((gx+def.size/2)*GS-player.x, (gy+def.size/2)*GS-player.y) > MAX_BUILD_DIST) return addLog('❌ Слишком далеко');
  for (let x=gx; x<gx+def.size; x++) for (let y=gy; y<gy+def.size; y++){
    const t = getTerrain(x,y);
    if (t !== 'grass') return addLog('❌ Нельзя строить на воде');
  }
  for (let x=gx; x<gx+def.size; x++) for (let y=gy; y<gy+def.size; y++) if (findBuilding(x,y)) return addLog('❌ Занято');
  if (state.gold < def.cost.g || state.wood < def.cost.w) return addLog('❌ Нет ресурсов');
  state.gold -= def.cost.g; state.wood -= def.cost.w;
  const {cx,cy} = gridToChunk(gx,gy);
  loadChunk(cx,cy).buildings.push({id:'b'+Date.now()+Math.random(), type:placing, gx, gy, level:1, owner:myId});
  if (def.type==='pop'){ spawnVillager(gx,gy); spawnVillager(gx,gy); addLog('🏠 Жители заселились!'); }
  save(); updateHUD(); placing = null; renderShop(); addLog('✅ Построено!');
  checkAchievements();
}

function getTownHall(){
  for (let c of chunks.values()) for (let b of c.buildings) if (b.type==='townHall' && b.owner===myId) return {b, chunk:c};
  return null;
}
function ensureTownHall(){
  let th = getTownHall();
  if (th){ state.townHallX = th.b.gx; state.townHallY = th.b.gy; state.townHallLevel = th.b.level; save(); return; }
  addLog('🏛️ Строительство Ратуши...');
  const pgx = Math.floor(player.x/GS), pgy = Math.floor(player.y/GS);
  for (let dist=1; dist<=5; dist++) for (let dx=-dist; dx<=dist; dx++) for (let dy=-dist; dy<=dist; dy++){
    if (Math.abs(dx)!==dist && Math.abs(dy)!==dist) continue;
    const gx = pgx+dx, gy = pgy+dy;
    let free = true;
    for (let x=gx; x<gx+2; x++) for (let y=gy; y<gy+2; y++){
      if (findBuilding(x,y) || getTerrain(x,y) !== 'grass') free = false;
    }
    if (!free) continue;
    const {cx,cy} = gridToChunk(gx,gy);
    loadChunk(cx,cy).buildings.push({id:'th_'+Date.now(), type:'townHall', gx, gy, level:1, owner:myId, isTownHall:true});
    state.townHallX = gx; state.townHallY = gy; state.townHallLevel = 1;
    save(); updateHUD(); renderShop();
    addLog('✅ Ратуша построена!');
    return;
  }
}

function tickEconomy(){
  const now = Date.now();
  const dt = (now - state.lastTick) / 1000;
  if (dt < 1) return;
  state.lastTick = now;
  const cap = storageCap();
  state.gold = Math.min(cap, state.gold + goldRate()*dt);
  state.wood = Math.min(cap, state.wood + woodRate()*dt);
  state.stone = Math.min(cap, state.stone + stoneRate()*dt);
  state.food = Math.min(cap, Math.max(0, state.food + foodRate()*dt - totalPopulation()*0.001*dt));
  state.researchPts += researchRate()*dt;
  state.rankPts = Math.floor((totalBuildings() + totalArmy()*0.5 + state.townHallLevel*5 + state.era*10)/10);
  updateHUD();
}

function advanceWeather(){
  const now = Date.now();
  if (now - state.lastWeather < 60000) return;
  state.lastWeather = now;
  const r = Math.random();
  state.weather = r<0.6?'clear':r<0.85?'rain':'snow';
  state.dayTime = (state.dayTime + 0.05) % 1;
  if (state.dayTime < 0.05) state.day++;
  if (!state.achievements.weather_set) state.achievements.weather_set = {};
  state.achievements.weather_set[state.weather] = true;
}

function randomEvent(){
  if (!state.settings.events) return;
  const now = Date.now();
  if (now - state.lastEvent < 45000) return;
  state.lastEvent = now;
  const r = Math.random();
  if (r < 0.15){ state.food = Math.max(0, state.food-20); addLog('🔥 Пожар: −20 еды'); }
  else if (r < 0.30){ state.gold = Math.max(0, state.gold-30); addLog('🦠 Эпидемия: −30 золота'); }
  else if (r < 0.45){ state.gold += 40; state.wood += 20; addLog('🎪 Ярмарка: +40🪙 +20🪵'); }
  else if (r < 0.60){ state.stone += 15; addLog('💎 Клад: +15 камня'); }
  else if (r < 0.75){ addLog('⚔️ Варвары у границ'); }
  else { state.food += 25; addLog('🌾 Урожай: +25 еды'); }
  updateHUD();
}

function trainingBattle(){
  if (totalArmy() < 1) return addLog('❌ Нет армии. Построй казармы');
  const enemyPower = 20 + Math.floor(state.rankPts*3 + Math.random()*20);
  const atk = armyPower()*(state.morale/100)*(0.85+Math.random()*0.3);
  const win = atk > enemyPower;
  const total = totalArmy();
  const lossPct = win ? 0.05+Math.random()*0.15 : 0.15+Math.random()*0.2;
  const lost = Math.max(1, Math.floor(total*lossPct));
  const infLost = Math.min(state.units.inf, Math.floor(lost*0.6));
  state.units.inf -= infLost;
  let rem = lost - infLost;
  const arcLost = Math.min(state.units.arc, Math.floor(rem*0.6));
  state.units.arc -= arcLost; rem -= arcLost;
  state.units.cav = Math.max(0, state.units.cav - Math.min(state.units.cav, rem));
  if (win){
    state.veterans += Math.floor(lost*0.3);
    const loot = 15 + Math.floor(enemyPower*0.5);
    state.gold += loot;
    state.ai.xp += 10;
    addLog(`⚔️ Победа! +${loot}🪙, −${lost}`);
    toast(`⚔️ Победа! +${loot}🪙`);
  } else {
    state.morale = Math.max(0, state.morale-10);
    state.ai.xp += 3;
    addLog(`💀 Поражение. −${lost}`);
    toast(`💀 Поражение`);
  }
  if (win) state.morale = Math.min(100, state.morale+5);
  save(); updateHUD(); checkAchievements(); checkAILevelUp();
}

    state.ai.xp -= aiXPNeeded();

    addLog(`🤖 ИИ ур.${state.ai.level}!`);
    toast(`🤖 ИИ ур.${state.ai.level}`);

function aiSuggestTip(){
  const now = Date.now();
  if (now - state.ai.lastTip < 20000) return;
  state.ai.lastTip = now;
  const tips = [];
  if (state.food < 20) tips.push('🌾 Еды мало — построй ферму');
  if (totalArmy() === 0) tips.push('⚔️ Нет армии — построй казармы');
  if (state.morale < 50) tips.push('😞 Мораль низкая — победи в тренировке');
  if (state.gold >= storageCap()*0.9) tips.push('📦 Склад почти полон');
  if (state.researchPts >= 20) tips.push('🔬 Есть очки — исследуй техи');
  if (happiness() < 40) tips.push('⛪ Недовольство — построй храм');
  if (state.townHallLevel < 3 && state.gold > 200) tips.push('🏛️ Хватит золота на апгрейд');
  if (!tips.length) tips.push('✅ Всё в порядке, ваше величество');
  const tip = tips[Math.floor(Math.random()*tips.length)];
  if (tip !== state.ai.lastTipText){
    state.ai.lastTipText = tip;
    state.ai.actions++;
    toast(tip);
    checkAILevelUp();
  }
}
function aiAutoAct(){
  if (state.ai.mode !== 'auto') return;
  const techs = Object.keys(TECH).filter(id => (state.tech[id]||0) < TECH[id].max);
  if (techs.length){
    const cheapest = techs.reduce((a,b)=> (TECH[a].cost(state.tech[a]||0) < TECH[b].cost(state.tech[b]||0)) ? a : b);
    const lvl = state.tech[cheapest]||0;
    if (state.researchPts >= TECH[cheapest].cost(lvl)){
      state.researchPts -= TECH[cheapest].cost(lvl);
      state.tech[cheapest] = lvl+1;
      state.ai.xp += 15;
      state.ai.actions++;
      addLog(`🤖 ИИ: ${TECH[cheapest].name} ур.${lvl+1}`);
      checkAILevelUp();
    }
  }
}

  const t = TECH[id]; if (!t) return;
  const lvl = state.tech[id]||0;
  if (lvl >= t.max) return;
  const cost = t.cost(lvl);
  if (state.researchPts < cost) return addLog(`❌ Нужно ${cost} очков`);
  state.researchPts -= cost;
  state.tech[id] = lvl + 1;
  state.ai.xp += 5;
  addLog(`🔬 ${t.name} → ур.${lvl+1}`);
  checkAILevelUp(); checkAchievements(); updateHUD(); renderTech();
}

// ===== ЦИКЛ =====
let lastTime = performance.now();
function loop(time){
  const dt = Math.min((time - lastTime)/1000, 0.1);
  lastTime = time;

  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup'] || keys['ц']) dy -= 1;
  if (keys['s'] || keys['arrowdown'] || keys['ы']) dy += 1;
  if (keys['a'] || keys['arrowleft'] || keys['ф']) dx -= 1;
  if (keys['d'] || keys['arrowright'] || keys['в']) dx += 1;
  if (dx !== 0 || dy !== 0){
    const len = Math.hypot(dx,dy);
    player.x += (dx/len)*player.speed*dt;
    player.y += (dy/len)*player.speed*dt;
    cam.targetX = player.x; cam.targetY = player.y;
  } else if (player.targetX !== undefined){
    const tdx = player.targetX - player.x, tdy = player.targetY - player.y;
    const dist = Math.hypot(tdx,tdy);
    if (dist < 5){ player.targetX = undefined; player.targetY = undefined; }
    else { player.x += (tdx/dist)*player.speed*dt; player.y += (tdy/dist)*player.speed*dt; cam.targetX = player.x; cam.targetY = player.y; }
  }
  villagers.forEach(v => {
    if (v.targetX === undefined){ v.targetX = v.x + (Math.random()-0.5)*150; v.targetY = v.y + (Math.random()-0.5)*150; }
    else {
      const vdx = v.targetX - v.x, vdy = v.targetY - v.y;
      const vdist = Math.hypot(vdx,vdy);
      if (vdist < 5) v.targetX = undefined;
      else { v.x += (vdx/vdist)*v.speed*dt; v.y += (vdy/vdist)*v.speed*dt; }
    }
  });
  cam.x += (cam.targetX - cam.x)*Math.min(1, dt*8);
  cam.y += (cam.targetY - cam.y)*Math.min(1, dt*8);

  ensureChunks();
  updateShips(dt);
  drawGround();

  const items = [];

  // Trees
  const tl2 = s2w(0,0), br2 = s2w(innerWidth,innerHeight);
  const tMinX = Math.floor(tl2.x/GS)-1, tMaxX = Math.ceil(br2.x/GS)+1;
  const tMinY = Math.floor(tl2.y/GS)-1, tMaxY = Math.ceil(br2.y/GS)+1;
  const occupied = new Set();
  chunks.forEach(c => c.buildings.forEach(b => {
    const sz = (S[b.type]||{size:1}).size;
    for (let x=b.gx; x<b.gx+sz; x++) for (let y=b.gy; y<b.gy+sz; y++) occupied.add(x+','+y);
  }));
  for (let gy=tMinY; gy<=tMaxY; gy++){
    for (let gx=tMinX; gx<=tMaxX; gx++){
      if (occupied.has(gx+','+gy)) continue;
      if (hasTreeAt(gx,gy)) items.push({y: gy*GS + GS*0.5, draw: () => drawTree(gx,gy)});
    }
  }

  // Buildings
  chunks.forEach(c => c.buildings.forEach(b => {
    if (Math.abs(b.gx*GS - player.x) < 2000 && Math.abs(b.gy*GS - player.y) < 2000){
      items.push({y: b.gy*GS + (S[b.type]?.size||1)*GS*0.5, draw: () => drawIsoBuilding(b)});
    }
  }));

  // Ships
  ships.forEach(s => items.push({y: s.y, draw: () => drawShip(s)}));

  // Villagers
  villagers.forEach(v => items.push({y: v.y, draw: () => drawHuman(v.x, v.y, false)}));

  // Player
  items.push({y: player.y, draw: () => drawHuman(player.x, player.y, true)});

  items.sort((a,b)=> a.y - b.y);
  items.forEach(i => i.draw());

  tickEconomy();
  advanceWeather();
  randomEvent();
  tickAI();

  if (state.settings.autosave && Date.now() - state.lastAutosave > 5000){
    state.lastAutosave = Date.now();
    save();
  }

  requestAnimationFrame(loop);
}

window.addEventListener('beforeunload', save);

addLog('Загрузка...');
ensureTownHall();
updateHUD();
renderShop();
requestAnimationFrame(loop);
</script>
</body>
</html>
